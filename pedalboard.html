<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- Content-Security-Policy: protectie XSS — blocheaza orice cod inline neasteptat.
     'unsafe-inline' la script si style e necesar pentru ca toata aplicatia e in HTML inline,
     dar pastram restrictiile pentru toate celelalte resurse (img, fonts, conexiuni). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com data:;
  img-src 'self' data: blob: https:;
  media-src 'self' blob:;
  connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://api.deezer.com https://api.groq.com https://itunes.apple.com https://api.openai.com https://generativelanguage.googleapis.com https://*.workers.dev https://www.songsterr.com https://corsproxy.io https://api.allorigins.win https://api.codetabs.com;
  frame-src https://www.youtube.com https://www.youtube-nocookie.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>musiknow</title>
<link rel="icon" type="image/png" href="iconita_musiknow.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Wendy+One&family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet"/>
<script>
// Pre-load tema înainte de a se afișa body-ul — evită flash de culoare greșită
(function(){
  try {
    var t = localStorage.getItem('mk_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch(e) {}
})();
</script>
<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#121014;
  --s1:#1a1c20;
  --s2:#22252b;
  --s3:#2a2d35;
  --border:#353841;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --gold:#c4b5fd;
  --green:#39ff14;
  --text:#d8dde5;
  --dim:#7a8190;
  --err:#ff6b6b;
  --bg-blur:rgba(18,16,20,.92);
  --bg-blur-strong:rgba(18,16,20,.98);
  --bg-blur-input:rgba(18,16,20,.5);
  --shadow:rgba(0,0,0,.5);
  --shadow-soft:rgba(0,0,0,.06);
  --grid-line:rgba(139,92,246,.03);
  --font-d:'Bebas Neue',sans-serif;
  --font-m:'JetBrains Mono',monospace;
  --r:6px;
  --glow:0 0 20px rgba(139,92,246,0.28);
  --glow-s:0 0 8px rgba(139,92,246,0.35);
  --focus-ring:0 0 0 3px rgba(139,92,246,.45);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-m);overflow-x:hidden;}
button{cursor:pointer;font-family:var(--font-m);}
input,select{font-family:var(--font-m);}
a{color:var(--accent);text-decoration:none;}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:44px 44px;
}

body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--shadow-soft) 2px,var(--shadow-soft) 4px);
}
#app{position:relative;z-index:1;min-height:100vh;}


.metro-bar{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  margin-bottom:16px;flex-wrap:wrap;
}
.metro-title{
  font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700;white-space:nowrap;
  font-family:var(--font-d);
}
.metro-dot{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  background:var(--accent);border:2px solid var(--accent2);
  transition:background .05s,box-shadow .05s;
  box-shadow:0 0 6px rgba(139,92,246,.4);
}
.metro-dot.beat{
  background:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.9),0 0 32px rgba(139,92,246,.6);
}
.metro-bpm-wrap{display:flex;align-items:center;gap:8px;}
.metro-bpm-label{font-size:.6rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.metro-bpm-val{
  font-family:var(--font-d);font-size:1.5rem;letter-spacing:.06em;
  color:var(--text);min-width:48px;text-align:center;
}
.metro-slider{
  -webkit-appearance:none;appearance:none;
  width:130px;height:4px;border-radius:2px;
  background:var(--s3);outline:none;cursor:pointer;
}
.metro-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--accent2);
}
.metro-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--accent2);
}
.metro-btn{
  display:flex;align-items:center;gap:6px;border:none;
  padding:9px 20px;border-radius:30px;font-size:.75rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
  cursor:pointer;font-family:var(--font-m);
}
.metro-btn.start{background:rgba(139,92,246,.2);border:1px solid var(--accent);color:var(--accent);}
.metro-btn.start:hover{background:rgba(139,92,246,.32);}
.metro-btn.stop{background:#8b5cf6;color:#fff;border:1px solid var(--accent);}
.metro-btn.stop:hover{background:var(--accent2);box-shadow:var(--glow);}

.metro-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);
  padding:4px 10px;border-radius:20px;font-size:.62rem;color:var(--accent);
  letter-spacing:.06em;cursor:pointer;transition:all .18s;
}
.metro-badge:hover{background:rgba(139,92,246,.22);}
.metro-badge-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  transition:background .05s,box-shadow .05s;
}
.metro-badge-dot.beat{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9);}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--s1);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}


.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;border-bottom:1px solid var(--border);
  background:var(--bg-blur);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.logo{
  font-family:'Wendy One',sans-serif;font-size:2.4rem;letter-spacing:.06em;
  line-height:1;text-shadow:0 0 30px rgba(139,92,246,.45);
  text-transform:lowercase;
}
.logo .lp{color:var(--accent);}
.logo .lw{color:#fff;}
.header-nav{display:flex;gap:10px;align-items:center;}
.nav-btn{
  background:none;border:1px solid var(--border);color:var(--dim);
  padding:6px 14px;border-radius:var(--r);font-size:.7rem;letter-spacing:.1em;
  text-transform:uppercase;transition:all .2s;
}
.nav-btn:hover,.nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.08);}
.back-btn{
  background:none;border:none;color:var(--dim);padding:6px 10px;
  font-size:.75rem;letter-spacing:.08em;transition:color .2s;display:flex;align-items:center;gap:6px;
}
.back-btn:hover{color:var(--accent);}
.badge{
  background:var(--accent);color:#000;font-size:.6rem;padding:2px 6px;
  border-radius:20px;font-weight:700;letter-spacing:.05em;margin-left:6px;
}


.center-page{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 20px;gap:32px;
}
.big-logo{
  font-family:'Wendy One',sans-serif;font-size:clamp(4rem,14vw,9rem);
  letter-spacing:.1em;line-height:1;text-align:center;text-transform:lowercase;
  background:linear-gradient(135deg,var(--text) 0%,var(--accent) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 40px rgba(139,92,246,.4));
}
.tagline{color:var(--dim);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;}
.setup-card{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:36px;max-width:500px;width:100%;display:flex;flex-direction:column;gap:20px;
}
.setup-card h2{font-family:var(--font-d);letter-spacing:.1em;font-size:1.4rem;color:var(--text);}
.setup-card p{color:var(--dim);font-size:.75rem;line-height:1.7;}
.setup-card ol{color:var(--dim);font-size:.73rem;line-height:2;padding-left:18px;}
.setup-card li code{
  background:var(--s3);color:var(--gold);padding:1px 6px;
  border-radius:3px;font-size:.7rem;
}
.inp{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:10px 14px;border-radius:var(--r);font-size:.8rem;width:100%;
  transition:border-color .2s;outline:none;
}
.inp:focus{border-color:var(--accent);}
.inp::placeholder{color:var(--dim);}
.btn-main{
  background:var(--accent);color:#fff;border:none;padding:13px 28px;
  border-radius:var(--r);font-size:.85rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;transition:all .2s;width:100%;
}
.btn-main:hover{background:var(--accent2);box-shadow:var(--glow);}
.btn-sec{
  background:transparent;border:1px solid var(--border);color:var(--dim);
  padding:11px 28px;border-radius:var(--r);font-size:.78rem;letter-spacing:.08em;
  text-transform:uppercase;transition:all .2s;width:100%;
}
.btn-sec:hover{border-color:var(--dim);color:var(--text);}
.spotify-btn{
  background:#1DB954;color:#000;border:none;padding:14px 36px;
  border-radius:30px;font-size:.9rem;font-weight:700;letter-spacing:.06em;
  display:flex;align-items:center;gap:10px;transition:all .25s;
}
.spotify-btn:hover{background:#1ed760;transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,185,84,.35);}
.spotify-btn svg{width:22px;height:22px;}
.demo-note{color:var(--dim);font-size:.68rem;text-align:center;}


.library{padding:0 24px 60px;}
.filter-bar{
  display:flex;gap:10px;padding:16px 0;flex-wrap:wrap;align-items:center;
  position:sticky;top:57px;z-index:50;
  background:var(--bg-blur);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);margin-bottom:4px;
}
.filter-bar .inp{width:220px;padding:8px 12px;font-size:.72rem;}
.filter-select{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:var(--r);font-size:.72rem;cursor:pointer;
  outline:none;transition:border-color .2s;
}
.filter-select:focus{border-color:var(--accent);}
.chip{
  border:1px solid var(--border);background:var(--s2);color:var(--dim);
  padding:5px 12px;border-radius:20px;font-size:.68rem;letter-spacing:.06em;
  cursor:pointer;transition:all .18s;text-transform:uppercase;
}
.chip:hover,.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.09);}
.song-count{color:var(--dim);font-size:.68rem;margin-left:auto;white-space:nowrap;}

.song-list{display:flex;flex-direction:column;gap:2px;padding-top:6px;}
.song-row{
  display:grid;grid-template-columns:32px 56px 1fr auto auto;
  align-items:center;gap:14px;padding:8px 14px;border-radius:var(--r);
  cursor:pointer;transition:background .15s;border:1px solid transparent;
}
.song-row:hover{background:var(--s1);border-color:var(--border);}
.song-row:hover .song-art{box-shadow:0 2px 14px rgba(139,92,246,.3);}
.song-row.active{background:var(--s2);border-color:var(--accent);}
.song-num{color:var(--dim);font-size:.68rem;text-align:right;}
.song-art{
  width:56px;height:56px;border-radius:6px;
  background:var(--s3);display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:.75rem;overflow:hidden;flex-shrink:0;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
.song-art img{width:100%;height:100%;object-fit:cover;display:block;}
.song-info{overflow:hidden;}
.song-title{
  font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--text);
}
.song-artist{
  font-size:.68rem;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px;
}
.tuning-tag{
  font-size:.65rem;letter-spacing:.06em;padding:3px 10px;border-radius:20px;
  border:1px solid var(--border);color:var(--dim);white-space:nowrap;
  cursor:pointer;transition:all .18s;text-transform:uppercase;
  font-weight:700;
}
.tuning-tag:hover{border-color:var(--accent);color:var(--accent);}
.tuning-tag.loading{animation:pulse 1.5s infinite;}
.popularity-bar{
  width:40px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;
}
.popularity-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;}


.top-brace-wrap{display:flex;gap:0;align-items:stretch;margin-bottom:4px;}
.top-brace{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:36px;min-width:36px;padding:8px 0;position:relative;flex-shrink:0;
}
.top-brace::before{
  content:'';position:absolute;left:16px;top:0;bottom:0;width:2px;
  background:var(--accent);border-radius:1px;
}
.top-brace::after{
  content:'';position:absolute;left:16px;top:0;width:10px;height:2px;background:var(--accent);border-radius:1px;
}
.top-brace-corner-b{position:absolute;left:16px;bottom:0;width:10px;height:2px;background:var(--accent);border-radius:1px;}
.top-brace-label{
  writing-mode:vertical-lr;transform:rotate(180deg);
  font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:700;white-space:nowrap;
  position:relative;z-index:1;
  background:var(--bg);padding:6px 0;
}
.top-brace-list{flex:1;min-width:0;}
.lib-divider{
  display:flex;align-items:center;gap:12px;
  margin:10px 0 4px;padding:0 4px;
}
.lib-divider-label{
  font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.lib-divider::before,.lib-divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}


.pager{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:24px 0 10px;flex-wrap:wrap;
}
.pager-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:7px 16px;border-radius:var(--r);font-size:.7rem;letter-spacing:.08em;
  cursor:pointer;transition:all .15s;font-family:var(--font-m);
}
.pager-btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent);}
.pager-btn[disabled]{opacity:.3;cursor:not-allowed;}
.pager-pages{display:flex;gap:4px;}
.pager-page-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  width:34px;height:34px;border-radius:var(--r);font-size:.7rem;
  cursor:pointer;transition:all .15s;font-family:var(--font-m);
}
.pager-page-btn:hover{border-color:var(--accent);color:var(--accent);}
.pager-page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .3s ease both;}


.song-detail{padding:0 24px 80px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.song-hero{
  display:flex;gap:24px;padding:28px 0 24px;border-bottom:1px solid var(--border);
  margin-bottom:28px;align-items:flex-start;
}
.hero-art{
  width:130px;height:130px;flex-shrink:0;border-radius:8px;overflow:hidden;
  background:var(--s2);box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;color:var(--dim);
  position:relative;
}
.hero-art img{width:100%;height:100%;object-fit:cover;}
.spotify-link{
  position:absolute;bottom:8px;right:8px;width:36px;height:36px;
  background:#1DB954;border:none;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  transition:transform .15s, background .15s;
  text-decoration:none;color:#fff;
}
.spotify-link:hover{transform:scale(1.12);background:#1ed760;}
.spotify-link svg{width:20px;height:20px;display:block;}
.hero-info{flex:1;padding-top:4px;}
.hero-title{font-family:var(--font-d);font-size:2.4rem;letter-spacing:.06em;line-height:1.1;color:var(--text);}
.hero-artist{color:var(--accent);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;}
.hero-album{color:var(--dim);font-size:.72rem;margin-top:4px;}
.hero-tuning-pill{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  background:var(--s2);border:1px solid var(--gold);border-radius:30px;
  padding:6px 16px;cursor:pointer;transition:all .2s;
}
.hero-tuning-pill:hover{background:rgba(196,181,253,.08);box-shadow:0 0 14px rgba(139,92,246,.2);}
.hero-tuning-pill span{font-size:.72rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.hero-tuning-pill small{color:var(--dim);font-size:.62rem;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.info-grid{grid-template-columns:1fr;}.song-hero{flex-direction:column;}.hero-art{width:100%;height:180px;}}
.info-card{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;transition:border-color .2s;
}
.info-card:hover{border-color:var(--s3);}
.info-card.full{grid-column:1/-1;}
.card-label{
  font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;font-weight:700;
}
.card-content{color:var(--text);font-size:.78rem;line-height:1.7;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tag{
  background:var(--s2);border:1px solid var(--border);
  padding:3px 10px;border-radius:4px;font-size:.65rem;
  letter-spacing:.04em;color:var(--dim);
}
.tag.instrument{border-color:#4a6fa5;color:#7bafd4;}
.tag.pedal{border-color:#6a4a8f;color:#b07cd4;cursor:pointer;transition:all .15s;}
.tag.pedal:hover{background:rgba(176,124,212,.1);border-color:#b07cd4;}
.tag.genre{border-color:#4a7a4a;color:#7dc47d;}
.loading-card{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:28px;display:flex;flex-direction:column;align-items:center;
  gap:14px;grid-column:1/-1;
}
.spinner{
  width:32px;height:32px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;
}
.loading-text{color:var(--dim);font-size:.72rem;letter-spacing:.1em;}


.pedal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:10px;}
.pedal-item{
  background:var(--s2);border:1px solid var(--border);border-radius:8px;
  padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:all .2s;
}
.pedal-item:hover{border-color:var(--accent);background:rgba(139,92,246,.05);}
.pedal-img-box{
  width:80px;height:100px;background:var(--s3);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:.58rem;text-align:center;overflow:hidden;
}
.pedal-img-box img{width:100%;height:100%;object-fit:contain;}
.pedal-name{font-size:.62rem;text-align:center;color:var(--dim);line-height:1.3;}
.pedal-go-btn{
  width:100%;background:var(--accent);color:#fff;border:none;
  padding:5px;border-radius:4px;font-size:.58rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;margin-top:4px;transition:background .2s;
}
.pedal-go-btn:hover{background:var(--accent2);}


.yt-btn{
  display:inline-flex;align-items:center;gap:8px;background:#ff0000;
  color:#fff;border:none;padding:8px 16px;border-radius:var(--r);
  font-size:.72rem;letter-spacing:.06em;transition:opacity .2s;
}
.yt-btn:hover{opacity:.85;}
.yt-embed{width:100%;aspect-ratio:16/9;border:none;border-radius:var(--r);margin-top:10px;}


.pedalboard{padding:20px 24px 80px;}
.pb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.pb-title{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.12em;color:var(--text);}


.live-bar{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  margin-bottom:16px;flex-wrap:wrap;
}
.live-btn{
  background:var(--accent);color:#fff;border:none;padding:11px 26px;
  border-radius:30px;font-size:.8rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;transition:all .22s;display:flex;align-items:center;gap:9px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(139,92,246,.35),0 1px 3px rgba(0,0,0,.2);
  cursor:pointer;
}
.live-btn.active{background:var(--green);color:#000;}
.live-btn:hover{opacity:.88;transform:scale(1.02);}
.live-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);}
.live-btn.active .live-dot{background:#000;animation:pulse .9s infinite;}
.live-status{color:var(--dim);font-size:.68rem;letter-spacing:.08em;flex-shrink:0;}
.live-status.connected{color:var(--green);}
.latency-tag{
  background:var(--s3);border:1px solid var(--border);padding:3px 10px;
  border-radius:20px;font-size:.6rem;color:var(--dim);letter-spacing:.06em;
}
.level-wrap{flex:1;min-width:100px;display:flex;flex-direction:column;gap:4px;}
.level-label{font-size:.55rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
.level-meter{
  height:7px;background:var(--s3);border-radius:4px;overflow:hidden;
}
.level-fill{
  height:100%;width:0%;border-radius:4px;transition:width .04s;
  background:linear-gradient(90deg,#39ff14 0%,#ffd700 70%,#ff4444 100%);
}


.amp-rack{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;margin-bottom:16px;
}
.amp-rack-title{
  font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:16px;font-weight:700;
}
.amp-rack-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.amp-rack-header .amp-rack-title{margin-bottom:0;}
.amp-power-btn{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.3);
  color:#e05555;padding:7px 16px;border-radius:30px;
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;font-family:var(--font-m);font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.amp-power-btn.on{background:rgba(57,255,20,.08);border-color:rgba(57,255,20,.35);color:var(--green);}
.amp-power-btn:hover{opacity:.85;}
.amp-power-led{
  width:8px;height:8px;border-radius:50%;background:#e05555;flex-shrink:0;
  box-shadow:0 0 6px #e05555;
}
.amp-power-btn.on .amp-power-led{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse .9s infinite;}
.amp-controls-muted{opacity:.35;pointer-events:none;}
.amp-controls{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;}
.amp-knob-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.amp-knob{
  width:42px;height:42px;border-radius:50%;cursor:ns-resize;touch-action:none;
  background:radial-gradient(circle at 38% 35%,#353545,#0a0a12);
  border:2px solid var(--border);position:relative;box-shadow:0 3px 10px rgba(0,0,0,.6);
  transition:border-color .15s;
}
.amp-knob:hover{border-color:var(--accent);}
.knob-dot{
  position:absolute;top:4px;left:50%;
  width:3px;height:12px;background:var(--accent);border-radius:1px;
  transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);
}
.amp-knob-label{font-size:.58rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
.amp-knob-val{font-size:.62rem;color:var(--text);min-width:30px;text-align:center;}
.cab-btn{
  display:flex;align-items:center;gap:7px;background:var(--s2);
  border:1px solid var(--border);padding:8px 14px;border-radius:var(--r);
  cursor:pointer;font-size:.68rem;color:var(--dim);letter-spacing:.06em;
  transition:all .15s;white-space:nowrap;
}
.cab-btn.on{border-color:var(--accent);color:var(--accent);}
.cab-led{width:8px;height:8px;border-radius:50%;background:var(--s3);flex-shrink:0;}
.cab-btn.on .cab-led{background:var(--accent);box-shadow:0 0 6px var(--accent);}


.signal-chain{
  display:flex;align-items:center;padding:12px 18px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  margin-bottom:20px;overflow-x:auto;min-height:50px;gap:0;
}
.signal-node{display:flex;align-items:center;white-space:nowrap;}
.signal-label{
  background:var(--s2);border:1px solid var(--border);border-radius:6px;
  padding:5px 12px;font-size:.65rem;letter-spacing:.08em;color:var(--dim);
  text-transform:uppercase;
}
.signal-label.active{border-color:var(--accent);color:var(--accent);}
.signal-arrow{color:var(--dim);padding:0 5px;font-size:.85rem;}


.pb-grid{display:flex;flex-wrap:wrap;gap:14px;}
.pedal-unit{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:14px 12px;width:138px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:grab;transition:border-color .2s,box-shadow .2s,transform .15s;
  user-select:none;position:relative;
  box-shadow:0 4px 12px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.25);
}
.pedal-unit:hover{border-color:var(--s3);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35);}
.pedal-unit.on{border-color:var(--accent);box-shadow:var(--glow-s),0 4px 12px rgba(0,0,0,.35);}
.pedal-unit.dragging{opacity:.35;}
.pedal-body{
  width:106px;height:126px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:9px 8px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.12),inset 0 -2px 4px rgba(0,0,0,.2);
}
.pedal-brand{font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);}
.pedal-model{font-family:var(--font-d);font-size:1.05rem;letter-spacing:.06em;text-align:center;color:#fff;line-height:1.1;}
.knob-row{display:flex;gap:7px;justify-content:center;}
.pedal-knob-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.pedal-knob{
  width:26px;height:26px;border-radius:50%;cursor:ns-resize;touch-action:none;
  background:radial-gradient(circle at 36% 34%,#444,#111);
  border:1px solid rgba(255,255,255,.18);position:relative;
  transition:border-color .12s;
}
.pedal-knob:hover{border-color:rgba(255,255,255,.5);}
.pedal-knob-dot{
  position:absolute;top:3px;left:50%;
  width:2px;height:8px;background:rgba(255,255,255,.85);border-radius:1px;
  transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);
}
.pedal-knob-label{font-size:.42rem;color:rgba(255,255,255,.35);letter-spacing:.04em;text-transform:uppercase;}
.bypass-foot{
  width:26px;height:26px;border-radius:50%;background:#787880;
  border:2px solid #9a9aa2;cursor:pointer;transition:all .15s;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
}
.pedal-unit.on .bypass-foot{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(57,255,20,.55);}
.pedal-name-label{font-size:.6rem;color:var(--dim);text-align:center;letter-spacing:.04em;}

.available-title{
  font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
/* Titlu mare de sectiune pe pedalboard (TABLA TA / AMP SETTINGS / ADAUGA PEDALE).
   Pe dark mode #d8dde5 (off-white moale), pe light mode #1a1a1a (aproape negru). */
.section-header-big{
  font-family:var(--font-d);font-size:1.5rem;letter-spacing:.1em;
  text-transform:uppercase;color:#d8dde5;margin-bottom:6px;line-height:1.1;
}
:root[data-theme="light"] .section-header-big{color:#1a1a1a;}
.section-header-sub{
  font-size:.62rem;letter-spacing:.08em;color:var(--dim);
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);
}
.add-pedal-btn{
  background:none;border:1px dashed var(--border);color:var(--dim);
  width:100%;padding:10px;border-radius:var(--r);font-size:.66rem;
  letter-spacing:.06em;text-transform:uppercase;transition:all .18s;
}
.add-pedal-btn:hover{border-color:var(--accent);color:var(--accent);}


.rec-bar{
  display:flex;align-items:center;gap:12px;padding:14px 20px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  margin-bottom:16px;flex-wrap:wrap;
}
.rec-btn{
  display:flex;align-items:center;gap:8px;border:none;
  padding:10px 22px;border-radius:30px;font-size:.78rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s;flex-shrink:0;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.15);
}
.rec-btn.idle{background:rgba(220,40,40,.15);border:1px solid rgba(220,40,40,.35);color:#e05555;}
.rec-btn.idle:hover{background:rgba(220,40,40,.28);}
.rec-btn.recording{background:#cc2222;color:#fff;animation:recpulse 1s infinite;}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(204,34,34,.5);}50%{box-shadow:0 0 0 8px rgba(204,34,34,0);}}
.rec-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;}
.rec-timer{
  font-family:var(--font-d);font-size:1.4rem;letter-spacing:.14em;
  color:var(--text);min-width:56px;
}
.rec-timer.active{color:#e05555;}
.rec-hint{color:var(--dim);font-size:.65rem;letter-spacing:.06em;}
.silent-rec-toggle{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:7px 12px;border-radius:20px;background:var(--s2);border:1px solid var(--border);
  font-size:.65rem;letter-spacing:.06em;color:var(--dim);transition:all .2s;
  user-select:none;flex-shrink:0;
}
.silent-rec-toggle:hover{border-color:var(--accent);color:var(--accent);}
.silent-rec-toggle input{accent-color:var(--accent);cursor:pointer;width:14px;height:14px;}
.silent-rec-toggle input:checked + span{color:var(--accent);font-weight:700;}
.silent-rec-toggle input:disabled{opacity:.5;cursor:not-allowed;}
.silent-rec-toggle:has(input:checked){border-color:var(--accent);background:rgba(139,92,246,.08);}

.recordings-section{margin-top:24px;}
.recordings-title{
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.rec-list{display:flex;flex-direction:column;gap:8px;}
.rec-item{
  background:var(--s1);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.rec-info{flex:1;min-width:120px;}
.rec-name{font-size:.75rem;color:var(--text);font-weight:700;}
.rec-dur{font-size:.62rem;color:var(--dim);margin-top:2px;letter-spacing:.06em;}
.rec-player{flex:2;min-width:200px;}
.rp-controls{display:flex;align-items:center;gap:8px;}
.rp-play-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--accent);
  width:30px;height:30px;border-radius:50%;font-size:.75rem;flex-shrink:0;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.rp-play-btn:hover{background:rgba(139,92,246,.15);border-color:var(--accent);}
.rp-time,.rp-total{font-size:.6rem;color:var(--dim);white-space:nowrap;min-width:28px;font-family:var(--font-m);}
.rp-bar-wrap{flex:1;padding:8px 0;cursor:pointer;}
.rp-bar{
  height:4px;background:var(--s3);border-radius:2px;
  position:relative;
}
.rp-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));
  border-radius:2px;width:0%;pointer-events:none;
}
.rp-dot{
  position:absolute;top:50%;left:0%;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px rgba(139,92,246,.6);
  pointer-events:none;transition:none;
}
.rec-actions{display:flex;gap:6px;}
.rec-dl-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:6px 12px;border-radius:var(--r);font-size:.65rem;letter-spacing:.06em;
  cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;
}
.rec-dl-btn:hover{border-color:var(--accent);color:var(--accent);}
.rec-del-btn{
  background:none;border:1px solid var(--border);color:var(--dim);
  padding:6px 10px;border-radius:var(--r);font-size:.65rem;cursor:pointer;transition:all .15s;
}
.rec-del-btn:hover{border-color:#e05555;color:#e05555;}


.tuner{padding:40px 24px;max-width:500px;margin:0 auto;}
.tuner-display{
  background:var(--s1);border:1px solid var(--border);border-radius:16px;
  padding:36px 28px;text-align:center;margin-bottom:24px;
}
.tuner-note{
  font-family:var(--font-d);font-size:7rem;line-height:1;letter-spacing:.1em;
  color:var(--text);transition:color .1s;
}
.tuner-note.in-tune{color:var(--green);text-shadow:0 0 30px rgba(57,255,20,.4);}
.tuner-freq{color:var(--dim);font-size:.75rem;margin-top:6px;letter-spacing:.1em;}
.tuner-cents{
  font-size:1rem;letter-spacing:.06em;margin-top:4px;
  transition:color .1s;
}
.tuner-cents.sharp{color:var(--accent);}
.tuner-cents.flat{color:#4a9eff;}
.tuner-cents.intune{color:var(--green);}
.needle-container{
  position:relative;width:100%;height:60px;margin:20px 0 10px;
}
.needle-scale{
  position:absolute;bottom:0;left:10%;right:10%;height:40px;
  border-bottom:2px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 4px;
}
.needle-tick{width:1px;background:var(--border);height:10px;}
.needle-tick.mid{height:18px;background:var(--dim);}
.needle{
  position:absolute;bottom:0;left:50%;width:2px;height:52px;
  background:var(--accent);transform-origin:bottom center;
  border-radius:1px;transition:transform .08s ease;
  box-shadow:0 0 8px var(--accent);
}
.needle::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;background:var(--accent);
}
.string-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px;}
.string-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:10px 6px;border-radius:var(--r);font-size:.75rem;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all .18s;
}
.string-btn:hover{border-color:var(--accent);color:var(--accent);}
.string-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.07);}
.string-num{font-size:.55rem;color:var(--dim);}
.tuner-mic-btn{
  background:var(--accent);color:#fff;border:none;padding:14px 32px;
  border-radius:30px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;
  width:100%;transition:all .2s;
}
.tuner-mic-btn.listening{background:var(--green);color:#000;animation:pulse 1.5s infinite;}
.tuner-mic-btn:hover{opacity:.9;}
.tuning-selector{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;margin-top:14px;
  max-height:280px;overflow-y:auto;padding-right:4px;
}
.tuning-opt{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:7px 6px;border-radius:var(--r);font-size:.6rem;text-align:center;
  letter-spacing:.03em;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tuning-opt:hover,.tuning-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.07);}


.empty{
  text-align:center;padding:80px 20px;color:var(--dim);
  font-size:.8rem;letter-spacing:.06em;
}
.divider{height:1px;background:var(--border);margin:20px 0;}
.section-title{
  font-family:var(--font-d);font-size:1.1rem;letter-spacing:.12em;
  color:var(--dim);margin-bottom:12px;text-transform:uppercase;
}
.error-box{
  background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.25);
  border-radius:var(--r);padding:12px 16px;color:var(--err);font-size:.72rem;
  line-height:1.6;
}
/* ═══ SIGNAL / ARCH PAGES ════════════════════════════════════════════════ */
.page-inner{max-width:760px;margin:0 auto;padding:32px 24px 80px;}
.page-title{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.1em;color:var(--text);margin-bottom:6px;}
.page-sub{color:var(--dim);font-size:.72rem;line-height:1.7;margin-bottom:28px;}
.diag-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;font-size:.72rem;
}
.diag-row+.diag-row{border-top:1px solid var(--border);}
.diag-val{font-size:.68rem;font-weight:700;letter-spacing:.06em;}
.diag-val.ok{color:var(--green);}
.diag-val.fail{color:var(--err);}
.diag-val.neutral{color:var(--dim);}
.diag-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.sig-banner{
  padding:12px 16px;border-radius:var(--r);font-size:.72rem;margin-bottom:16px;
}
.sig-banner.ok{background:rgba(57,255,20,.07);border:1px solid rgba(57,255,20,.3);color:var(--green);}
.sig-banner.warn{background:rgba(255,180,0,.07);border:1px solid rgba(255,180,0,.3);color:#ffd700;}
.sig-banner.idle{background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.2);color:var(--dim);}
.monitor-bar{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;border:1px solid var(--border);flex:1;}
.monitor-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),#ffd700,#ff4444);border-radius:5px;transition:width .04s;}
.arch-pre{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;font-size:.62rem;color:var(--gold);overflow-x:auto;line-height:1.9;
  font-family:var(--font-m);margin-bottom:24px;
}
.arch-section{margin-bottom:28px;}
.arch-section-title{
  font-family:var(--font-d);font-size:1.05rem;letter-spacing:.1em;
  color:var(--accent);margin-bottom:10px;text-transform:uppercase;
}


.ai-chat-panel{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  margin-top:20px;overflow:hidden;
  box-shadow:0 4px 32px rgba(139,92,246,.08);
}
.ai-chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(139,92,246,.07),transparent);
}
.ai-chat-title{
  display:flex;align-items:center;gap:9px;
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}
.ai-chat-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;
  box-shadow:0 0 7px var(--accent);animation:aipulse 2s infinite;
}
@keyframes aipulse{0%,100%{opacity:1;box-shadow:0 0 7px var(--accent);}50%{opacity:.4;box-shadow:0 0 14px var(--accent);}}
.ai-chat-sub{font-size:.58rem;color:var(--dim);letter-spacing:.02em;text-transform:none;font-weight:400;}
.ai-chat-messages{
  padding:14px 16px;min-height:80px;max-height:320px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
.ai-msg{display:flex;gap:9px;animation:fadeIn .22s ease both;}
.ai-msg.user{flex-direction:row-reverse;}
.ai-avatar{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;
}
.ai-msg.assistant .ai-avatar{background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.28);color:var(--accent);}
.ai-msg.user     .ai-avatar{background:var(--s3);border:1px solid var(--border);color:var(--dim);}
.ai-bubble{
  max-width:84%;padding:8px 13px;border-radius:10px;
  font-size:.72rem;line-height:1.68;
}
.ai-msg.assistant .ai-bubble{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  border-top-left-radius:3px;
}
.ai-msg.user .ai-bubble{
  background:rgba(139,92,246,.13);border:1px solid rgba(139,92,246,.22);
  color:var(--text);border-top-right-radius:3px;
}
.ai-bubble.typing{color:var(--dim);font-style:italic;}
.ai-suggestions{
  display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;
}
.ai-suggest-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:5px 11px;border-radius:20px;font-size:.62rem;letter-spacing:.04em;
  cursor:pointer;transition:all .17s;font-family:var(--font-m);
}
.ai-suggest-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.07);}
.ai-chat-input-row{
  display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);
  background:var(--bg-blur-input);
}
.ai-chat-inp{
  flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:9px 13px;border-radius:var(--r);font-size:.73rem;outline:none;
  font-family:var(--font-m);transition:border-color .18s;
}
.ai-chat-inp:focus{border-color:var(--accent);}
.ai-chat-inp::placeholder{color:var(--dim);}
.ai-send-btn{
  background:var(--accent);color:#fff;border:none;
  padding:9px 16px;border-radius:var(--r);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .18s;flex-shrink:0;
  font-family:var(--font-m);
}
.ai-send-btn:hover{background:var(--accent2);box-shadow:var(--glow-s);}
.ai-send-btn:disabled{opacity:.4;cursor:not-allowed;}
.ai-no-key{
  padding:18px 16px;text-align:center;color:var(--dim);font-size:.7rem;line-height:1.7;
}
.ai-no-key a{color:var(--accent);}
.search-login-banner{
  margin:16px 0 0;padding:14px 20px;
  background:rgba(29,185,84,.06);border:1px solid rgba(29,185,84,.22);
  border-radius:10px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}

/* ═══════════════════════════════════════════════════════════════════════════
   PLAYLISTS PAGE — grid de carduri + detaliu + modal de adaugare
   ═══════════════════════════════════════════════════════════════════════════ */
.playlists-page{padding:20px 32px 80px;max-width:none;margin:0;}
.pl-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
}
.pl-title{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.1em;color:var(--text);}
.pl-create-btn{
  background:var(--accent);color:#fff;border:none;
  padding:10px 20px;border-radius:30px;font-size:.78rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;transition:all .2s;
  cursor:pointer;display:flex;align-items:center;gap:8px;
}
.pl-create-btn:hover{background:var(--accent2);box-shadow:var(--glow);}
.pl-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}
.pl-card{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:0;overflow:hidden;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;
}
.pl-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px var(--shadow);}
.pl-cover{
  height:140px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-d);font-size:3rem;letter-spacing:.05em;
  position:relative;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}
.pl-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(0,0,0,.2));
  pointer-events:none;
}
.pl-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.pl-card-name{font-size:.9rem;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-card-meta{font-size:.65rem;color:var(--dim);letter-spacing:.04em;}
.pl-card-actions{
  display:flex;gap:6px;padding:0 16px 12px;
}
.pl-action-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--dim);
  padding:5px 10px;border-radius:var(--r);font-size:.62rem;letter-spacing:.05em;
  cursor:pointer;transition:all .15s;text-transform:uppercase;flex:1;
  font-family:var(--font-m);
}
.pl-action-btn:hover{border-color:var(--accent);color:var(--accent);}
.pl-action-btn.delete:hover{border-color:var(--err);color:var(--err);}

/* Detalii playlist */
.pl-detail{padding:0 0 40px;}
.pl-detail-hero{
  display:flex;gap:24px;padding:24px 0 28px;border-bottom:1px solid var(--border);
  margin-bottom:24px;align-items:flex-end;flex-wrap:wrap;
}
.pl-detail-cover{
  width:160px;height:160px;flex-shrink:0;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-d);font-size:4rem;
  box-shadow:0 8px 28px var(--shadow);position:relative;
}
.pl-detail-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(0,0,0,.2));
  pointer-events:none;
}
.pl-detail-info{flex:1;min-width:200px;}
.pl-detail-label{
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px;font-weight:700;
}
.pl-detail-name{
  font-family:var(--font-d);font-size:2.4rem;letter-spacing:.06em;
  line-height:1.1;color:var(--text);
}
.pl-detail-desc{color:var(--dim);font-size:.72rem;margin-top:8px;line-height:1.6;}
.pl-detail-stats{
  font-size:.65rem;color:var(--dim);margin-top:8px;letter-spacing:.06em;
}
.pl-detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* Modal — folosit pentru: nou playlist, redenumire, picker adaugare melodie */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  padding:20px;animation:fadeIn .15s ease;backdrop-filter:blur(4px);
}
.modal-box{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:24px 26px;max-width:420px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:14px;
  animation:fadeIn .2s ease;max-height:80vh;overflow-y:auto;
}
.modal-title{
  font-family:var(--font-d);font-size:1.3rem;letter-spacing:.08em;
  color:var(--text);
}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.modal-btn{
  padding:9px 18px;border-radius:var(--r);font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .2s;
  font-family:var(--font-m);
}
.modal-btn.primary{background:var(--accent);color:#fff;border:none;}
.modal-btn.primary:hover{background:var(--accent2);box-shadow:var(--glow-s);}
.modal-btn.primary:disabled{opacity:.4;cursor:not-allowed;}
.modal-btn.danger{background:var(--err);color:#fff;border:none;}
.modal-btn.danger:hover{filter:brightness(1.15);}
.modal-btn.sec{background:transparent;border:1px solid var(--border);color:var(--dim);}
.modal-btn.sec:hover{border-color:var(--text);color:var(--text);}
.modal-list{
  display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;
  margin:6px 0;border:1px solid var(--border);border-radius:var(--r);padding:6px;
}
.modal-pl-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--r);cursor:pointer;transition:background .15s;
}
.modal-pl-item:hover{background:var(--s2);}
.modal-pl-mini-cover{
  width:34px;height:34px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-d);font-size:1rem;
}
.modal-pl-info{flex:1;min-width:0;}
.modal-pl-name{font-size:.78rem;color:var(--text);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.modal-pl-count{font-size:.62rem;color:var(--dim);margin-top:2px;}
.modal-pl-status{font-size:.62rem;color:var(--green);letter-spacing:.06em;font-weight:700;}

/* Sectiune cu cover upload in modal-ul de creare/editare playlist */
.modal-cover-section{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:8px 0 4px;
}
.modal-cover-preview{
  width:140px;height:140px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-d);font-size:3.4rem;
  box-shadow:0 4px 16px var(--shadow);
  overflow:hidden;position:relative;
  transition:transform .15s;
}
.modal-cover-preview span{
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}
.modal-cover-preview:hover{transform:scale(1.02);}
.modal-cover-actions{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
}
.modal-cover-section .modal-btn{
  padding:7px 14px;font-size:.66rem;
}
.modal-cover-hint{
  font-size:.6rem;color:var(--dim);letter-spacing:.04em;
  text-align:center;line-height:1.4;
}

/* Buton "add to playlist" pe randul de melodii */
.add-to-pl-btn{
  background:transparent;border:1px solid var(--border);color:var(--dim);
  width:30px;height:30px;border-radius:50%;cursor:pointer;transition:all .15s;
  font-size:1.1rem;line-height:1;flex-shrink:0;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.add-to-pl-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.08);}

/* Toast notification (pop-up scurt cand se adauga o melodie) */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--s1);border:1px solid var(--accent);border-radius:30px;
  padding:11px 22px;color:var(--text);font-size:.78rem;
  box-shadow:var(--glow);z-index:2000;letter-spacing:.04em;
  animation:toastSlide .25s ease;
}
@keyframes toastSlide{
  from{opacity:0;transform:translateX(-50%) translateY(20px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}

/* Responsive pentru playlists */
@media(max-width:600px){
  .playlists-page{padding:14px 12px 60px;}
  .pl-header{margin-bottom:16px;}
  .pl-title{font-size:1.4rem;}
  .pl-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .pl-cover{height:110px;font-size:2.2rem;}
  .pl-card-body{padding:10px 12px;}
  .pl-card-name{font-size:.78rem;}
  .pl-card-meta{font-size:.6rem;}
  .pl-card-actions{padding:0 12px 10px;}
  .pl-detail-hero{gap:14px;padding:18px 0 18px;flex-direction:column;align-items:flex-start;}
  .pl-detail-cover{width:120px;height:120px;font-size:3rem;}
  .pl-detail-name{font-size:1.8rem;}
  .modal-box{padding:18px;}
}

/* ═══════════════════════════════════════════════════════════════════════════
   TEMA LIGHT — overrides specifice pentru elemente cu shadow/glow hardcoded
   (variabilele de mai sus din :root[data-theme="light"] schimba culorile principale)
   ═══════════════════════════════════════════════════════════════════════════ */
:root[data-theme="light"]{color-scheme:light;}
:root[data-theme="light"] body{color-scheme:light;}
:root[data-theme="light"] .song-art{
  box-shadow:0 3px 12px rgba(75,40,150,.18),0 1px 3px rgba(75,40,150,.1);
  border:1px solid rgba(75,40,150,.1);
}
.song-row:hover .song-art{box-shadow:0 4px 16px rgba(139,92,246,.3);}
:root[data-theme="light"] .song-row:hover .song-art{box-shadow:0 6px 20px rgba(75,40,150,.28),0 2px 6px rgba(75,40,150,.15);}
:root[data-theme="light"] .hero-art{box-shadow:0 12px 32px rgba(75,40,150,.22),0 4px 12px rgba(75,40,150,.12);}
:root[data-theme="light"] .pedal-unit{box-shadow:0 4px 14px rgba(75,40,150,.18),0 1px 3px rgba(75,40,150,.1);}
:root[data-theme="light"] .pedal-unit:hover{box-shadow:0 14px 32px rgba(75,40,150,.28),0 4px 10px rgba(75,40,150,.18);}
:root[data-theme="light"] .spotify-link{box-shadow:0 2px 8px rgba(0,0,0,.15);}

/* SHADOW GLOBAL pe toate butoanele in LIGHT MODE — adauga adancime, scoate butoanele in evidenta.
   Folosim un selector larg care prinde butoanele standard ale aplicatiei. */
:root[data-theme="light"] button,
:root[data-theme="light"] .btn-main,
:root[data-theme="light"] .btn-sec,
:root[data-theme="light"] .nav-btn,
:root[data-theme="light"] .chip,
:root[data-theme="light"] .tuner-mic-btn,
:root[data-theme="light"] .metro-btn,
:root[data-theme="light"] .metro-toggle,
:root[data-theme="light"] .add-pedal-btn,
:root[data-theme="light"] .tuning-opt,
:root[data-theme="light"] .av-pedal-card,
:root[data-theme="light"] .silent-rec-toggle{
  box-shadow:0 2px 6px rgba(75,40,150,.12),0 1px 2px rgba(75,40,150,.08);
}
:root[data-theme="light"] button:hover,
:root[data-theme="light"] .btn-main:hover,
:root[data-theme="light"] .btn-sec:hover,
:root[data-theme="light"] .nav-btn:hover,
:root[data-theme="light"] .chip:hover,
:root[data-theme="light"] .tuner-mic-btn:hover,
:root[data-theme="light"] .metro-btn:hover,
:root[data-theme="light"] .metro-toggle:hover,
:root[data-theme="light"] .add-pedal-btn:hover,
:root[data-theme="light"] .tuning-opt:hover,
:root[data-theme="light"] .av-pedal-card:hover,
:root[data-theme="light"] .silent-rec-toggle:hover{
  box-shadow:0 4px 12px rgba(75,40,150,.2),0 2px 4px rgba(75,40,150,.12);
}
/* Spotify button — pastreaza shadow-ul lui propriu, nu cel general */
:root[data-theme="light"] .spotify-btn{box-shadow:0 4px 14px rgba(34,197,94,.4),0 2px 6px rgba(34,197,94,.25);}
:root[data-theme="light"] .spotify-btn:hover{box-shadow:0 8px 22px rgba(34,197,94,.5),0 3px 8px rgba(34,197,94,.35);}
/* Live btn — purple glow propriu */
:root[data-theme="light"] .live-btn{box-shadow:0 4px 12px rgba(139,92,246,.35),0 1px 3px rgba(0,0,0,.15);}

/* Light mode — culori mai vibrante pentru pedale.
   Saturate 1.35 face culorile sa "popeze" mai mult (verzi mai verzi, rosii mai rosii)
   iar brightness 1.08 aduce o luminozitate placuta fara sa piarda contrastul cu textul alb.
   Aplicat doar pe .pedal-body care are background-color (culoarea pedalei), nu pe pedal-unit
   intreg (care e cardul alb din spate). */
:root[data-theme="light"] .pedal-body{
  filter:saturate(1.35) brightness(1.08);
}
/* LED-ul verde aprins (cand pedala e ON) — glow mai pronuntat pe fundal deschis.
   Pe dark mode era #39ff14 neon, aici #22c55e tot vibrant dar respecta paleta. */
:root[data-theme="light"] .pedal-unit.on .bypass-foot{
  background:#22c55e;border-color:#16a34a;
  box-shadow:0 0 12px rgba(34,197,94,.6);
}
/* Bordura pedalei active — purple cu glow mai intens in light mode */
:root[data-theme="light"] .pedal-unit.on{
  border-color:var(--accent);box-shadow:0 0 18px rgba(139,92,246,.32);
}
/* Available pedals list — etichete colorate mai vibrante (la fel ca pe pedalboard) */
:root[data-theme="light"] .av-pedal-card{
  filter:saturate(1.25) brightness(1.05);
}
/* "✓ Added" status — verde vibrant si pe playlist modal */
:root[data-theme="light"] .modal-pl-status{color:#16a34a;}
/* Tuning chip activ — purple mai puternic */
:root[data-theme="light"] .chip.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 8px rgba(139,92,246,.3);
}
:root[data-theme="light"] .tuner-note.in-tune{text-shadow:0 0 20px rgba(21,128,61,.35);}
/* Input level gradient — culori MAI VIBRANTE pe light mode (verde mai pop, galben mai vivid, rosu deschis) */
:root[data-theme="light"] .level-fill{background:linear-gradient(90deg,#22c55e 0%,#facc15 70%,#ef4444 100%);}
:root[data-theme="light"] .monitor-fill{background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);}
:root[data-theme="light"] .rec-btn.recording{background:#b91c1c;}
/* Tuner pe light mode: textele auxiliare devin mai inchise pentru lizibilitate.
   Numele tuningurilor (.tuning-opt) raman cu paleta lor proprie. */
:root[data-theme="light"] .tuner-freq{color:#2a1d4d;}
:root[data-theme="light"] .string-num{color:#2a1d4d;}
:root[data-theme="light"] .string-btn div[style*="color:var(--dim)"]{color:#2a1d4d !important;}
:root[data-theme="light"] .needle-tick{background:#5a4a7e;}
:root[data-theme="light"] .needle-tick.mid{background:#2a1d4d;}
:root[data-theme="light"] .signal-chain{background:var(--s1);}
/* Knob-urile pe LIGHT mode — gradient deschis cu nuanta de purple
   (pe dark mode raman negre, ca knob-uri fizice de amplificator real) */
:root[data-theme="light"] .amp-knob{
  background:radial-gradient(circle at 38% 35%,#ffffff,#d4cce8);
  border-color:#a78bfa;
  box-shadow:0 3px 10px rgba(80,55,130,.18),inset 0 1px 2px rgba(255,255,255,.6);
}
:root[data-theme="light"] .amp-knob:hover{border-color:var(--accent);}
:root[data-theme="light"] .pedal-knob{
  background:radial-gradient(circle at 36% 34%,#f5f0ff,#c4b5fd);
  border-color:rgba(139,92,246,.3);
}
:root[data-theme="light"] .pedal-knob:hover{border-color:rgba(139,92,246,.6);}
/* Pe light mode, dot-ul de pe knob trebuie sa fie mai inchis ca sa se vada pe fundalul light */
:root[data-theme="light"] .pedal-knob-dot{background:rgba(75,40,150,.7);}
/* Logo letters: pe dark mode "k" si "n" sunt albe pe fundal inchis,
   pe light mode sunt gri mediu (in loc de negru pur — mai elegant, less harsh) */
:root[data-theme="light"] .logo .lw{color:#1a1a1a;}
/* Logo mic din header (dreapta sus) — shadow purple subtil in light mode
   ca sa nu para "lipit" de fundal */
:root[data-theme="light"] .logo{
  text-shadow:0 2px 6px rgba(75,40,150,.25),0 1px 2px rgba(75,40,150,.18);
}
:root[data-theme="light"] .big-logo{
  background:none;color:#704ac7;
  -webkit-background-clip:initial;-webkit-text-fill-color:initial;
  /* Shadow mai mic si mai intunecat — discret, sa nu domine pagina */
  text-shadow:0 2px 6px rgba(30,15,60,.35),0 1px 2px rgba(30,15,60,.45);
  filter:none;
}

/* ═══════════════════════════════════════════════════════════════════════════
   RESPONSIVE / MOBILE — hamburger menu + media queries
   Breakpoints: 900px tablet, 600px telefon, 380px telefon mic
   ═══════════════════════════════════════════════════════════════════════════ */

/* HAMBURGER — ascuns pe desktop, vizibil pe mobil */
.hamburger-btn{
  display:none;background:none;border:1px solid var(--border);
  border-radius:var(--r);width:42px;height:42px;padding:0;cursor:pointer;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
  flex-shrink:0;transition:border-color .2s;
}
.hamburger-btn:hover{border-color:var(--accent);}
.hamburger-btn span{
  width:20px;height:2px;background:var(--accent);border-radius:1px;
  transition:transform .25s ease,opacity .2s;display:block;
}
.hamburger-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger-btn.open span:nth-child(2){opacity:0;}
.hamburger-btn.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* Drawer cu nav-uri pe mobil */
.mobile-nav{
  display:none;position:fixed;top:0;left:0;right:0;
  background:var(--bg-blur-strong);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);z-index:99;
  padding:74px 18px 24px;flex-direction:column;gap:6px;
  transform:translateY(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  max-height:100vh;overflow-y:auto;
}
.mobile-nav.open{transform:translateY(0);}
.mobile-nav .nav-btn{
  width:100%;text-align:left;padding:13px 18px;font-size:.78rem;
  border-radius:8px;display:flex;align-items:center;
}
.mobile-nav .nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.1);}
.mobile-nav-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:98;opacity:0;transition:opacity .25s;
}
.mobile-nav-overlay.show{display:block;opacity:1;}
.mobile-nav-divider{
  height:1px;background:var(--border);margin:6px 0;
}
.mobile-nav-section{
  font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);padding:8px 18px 4px;
}

/* TABLET — ascundem nav-urile largi, aratam hamburgerul */

/* ═══════════════════════════════════════════════════════════════════════════
   LIGHT THEME — toggleable via [data-theme="light"] pe <html>
   Variabilele CSS se schimbă, dar majoritatea regulilor folosesc var(--*)
   așa că adaptarea e automată. Override-urile sunt pentru rgba-uri hardcoded.
   ═══════════════════════════════════════════════════════════════════════════ */
:root[data-theme="light"]{
  --bg:#f1f0fa;
  --s1:#ffffff;
  --s2:#e8e5f5;
  --s3:#d4cce8;
  --border:#c4b8dc;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --gold:#c4b5fd;
  --green:#22c55e;
  --text:#2a1d4d;
  --dim:#7a6c95;
  --err:#dc2626;
  --bg-blur:rgba(241,240,250,.92);
  --bg-blur-strong:rgba(241,240,250,.98);
  --bg-blur-input:rgba(255,255,255,.75);
  --shadow:rgba(80,55,130,.12);
  --shadow-soft:rgba(80,55,130,.04);
  --grid-line:rgba(139,92,246,.05);
  --glow:0 0 16px rgba(139,92,246,.25);
  --glow-s:0 0 6px rgba(139,92,246,.32);
  --focus-ring:0 0 0 3px rgba(139,92,246,.4);
}
/* Toate elementele folosesc var(--bg-blur), var(--grid-line), var(--shadow-soft)
   care se schimba automat in light theme. O singura exceptie: overlay-ul de pe
   drawer-ul mobil — pe light theme vrem o tenta mai delicata. */
:root[data-theme="light"] .mobile-nav-overlay{background:rgba(0,0,0,.35);}
/* Knob-urile arată ca knob-uri fizice - rămân întunecate pe ambele teme */
/* Butoane care folosesc text alb (#fff) pe accent rămân la fel */
/* Spotify și YouTube butoane păstrează culorile lor de brand */

/* Toggle theme button */
.theme-toggle{
  background:none;border:1px solid var(--border);color:var(--dim);
  width:42px;height:34px;border-radius:var(--r);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;transition:all .2s;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:var(--font-m);font-weight:700;
}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
.theme-toggle svg{width:16px;height:16px;}

/* ═══════════════════════════════════════════════════════════════════════════
   ACCESIBILITATE — focus vizibil, skip link, screen-reader, reduced-motion
   ═══════════════════════════════════════════════════════════════════════════ */

/* Skip link pentru tastatură/screen reader — sare direct la conținut */
.skip-link{
  position:absolute;top:-100px;left:8px;
  background:var(--accent);color:#fff;padding:10px 18px;border-radius:var(--r);
  font-size:.78rem;font-weight:700;letter-spacing:.06em;
  z-index:10000;transition:top .2s;text-decoration:none;
}
.skip-link:focus{top:8px;outline:2px solid var(--gold);outline-offset:2px;}

/* Clasă pentru text vizibil doar de screen-readere */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* Focus vizibil pe TOATE elementele interactive — important pentru tastatură */
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--r);
}
/* Ascundem focus-ul când utilizatorul folosește mouse (nu vrea outline pretutindeni) */
button:focus:not(:focus-visible),
a:focus:not(:focus-visible){outline:none;}

/* Respectăm preferința utilizatorului de a reduce animațiile */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* High-contrast mode (pentru utilizatori cu vedere slabă) */
@media(prefers-contrast:more){
  :root{
    --border:#3a4250;
    --dim:#9097a3;
  }
  :root[data-theme="light"]{
    --border:#1a1718;
    --dim:#3a3633;
  }
  button,.nav-btn,.chip,.filter-select,.inp{border-width:2px;}
}

//  PERSISTENT METRONOME ENGINE — survives page navigation
const METRO = (() => {
  let ctx = null;
  let running = false;
  let bpm = 120;
  let nextBeatTime = 0;
  let schedulerTimer = null;
  let beatCallbacks = [];  // listeners for visual flash

  function _getCtx() {
    if (!ctx || ctx.state === 'closed') {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function _scheduleClick(when) {
    const c = _getCtx();
    const osc = c.createOscillator();
    const env = c.createGain();
    osc.frequency.value = 1000;
    osc.type = 'sine';
    env.gain.setValueAtTime(0.35, when);
    env.gain.exponentialRampToValueAtTime(0.001, when + 0.04);
    osc.connect(env);
    env.connect(c.destination);
    osc.start(when);
    osc.stop(when + 0.05);
    const delay = Math.max(0, (when - c.currentTime) * 1000);
    setTimeout(() => { beatCallbacks.forEach(cb => cb()); }, delay);
  }

  function _scheduler() {
    const c = _getCtx();
    const scheduleAhead = 0.1; // seconds
    while (nextBeatTime < c.currentTime + scheduleAhead) {
      _scheduleClick(nextBeatTime);
      nextBeatTime += 60.0 / bpm;
    }
    schedulerTimer = setTimeout(_scheduler, 25);
  }

  return {
    isRunning() { return running; },
    getBpm()    { return bpm; },
    setBpm(v)   { bpm = Math.max(20, Math.min(300, v)); },
    start() {
      if (running) return;
      running = true;
      const c = _getCtx();
      nextBeatTime = c.currentTime + 0.05;
      _scheduler();
    },
    stop() {
      if (!running) return;
      running = false;
      clearTimeout(schedulerTimer);
      schedulerTimer = null;
    },
    onBeat(cb)    { beatCallbacks.push(cb); },
    offBeat(cb)   { beatCallbacks = beatCallbacks.filter(f => f !== cb); },
  };
})();

async function fetchItunesArtwork(artist, trackName) {
  try {
    const q = encodeURIComponent(`${artist} ${trackName}`);
    const r = await fetch(
      `https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`,
      {mode: 'cors'}
    );
    const data = await r.json();
    const url = data.results?.[0]?.artworkUrl100;
    return url ? url.replace('100x100bb', '600x600bb') : null;
  } catch {
    return null;
  }
}

async function loadArtworkForSongs(songs) {
  const missing = songs.filter(s => !s.image);
  if (!missing.length) return;
  const CHUNK = 6; // iTunes răspunde mai bine cu lot-uri mici decât cu 50+ cereri concurente
  for (let i = 0; i < missing.length; i += CHUNK) {
    const chunk = missing.slice(i, i + CHUNK);
    await Promise.all(
      chunk.map(async song => {
        const url = await fetchItunesArtwork(song.artist, song.name);
        if (url) {
          song.image = url;
          const idx = state.songs.findIndex(s => s.id === song.id);
          if (idx !== -1) state.songs[idx].image = url;
        }
      })
    );
    // Re-randăm doar dacă utilizatorul e încă pe pagina library, ca pozele să apară progresiv
    if (state.page === 'library') render();
  }
}

function genVerifier() {
  const a = new Uint8Array(96);
  crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function genChallenge(v) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function redirectUri() {
  return window.location.origin + window.location.pathname;
}
async function spotifyLogin() {
  const v = genVerifier();
  const c = await genChallenge(v);
  sessionStorage.setItem('_pv', v);
  const p = new URLSearchParams({
    client_id: state.clientId,
    response_type: 'code',
    redirect_uri: redirectUri(),
    scope: 'user-library-read user-top-read user-read-private user-read-email',
    code_challenge_method: 'S256',
    code_challenge: c,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function exchangeCode(code) {
  const v = sessionStorage.getItem('_pv');
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      client_id: state.clientId, grant_type: 'authorization_code',
      code, redirect_uri: redirectUri(), code_verifier: v,
    })
  });
  const data = await r.json();
  if (data.access_token) {
    state.token = data.access_token;
    sessionStorage.setItem('mk_token', data.access_token);

    // CRITICAL: La login nou cu Spotify, curatam orice cache vechi de melodii.
    // Fara asta, melodiile demo (sau melodiile altui utilizator) raman in sessionStorage
    // si loadSongs() nu mai e apelat — utilizatorul vede vechiul cache in loc de biblioteca lui.
    state.demoMode = false;
    state.songsLoaded = false;
    state.songsLoadingMore = false;
    state.songs = [];
    state.topSongs = [];
    state._totalLiked = 0;
    state.selectedSong = null;
    state.songInfo = {};
    state.searchResults = [];
    state.searchQuery = '';
    state.filter = { search: '', tuning: '', artist: '' };
    state.libraryPage = 0;
    sessionStorage.removeItem('mk_demo_mode');
    sessionStorage.removeItem('mk_songs');
    sessionStorage.removeItem('mk_topsongs');
    sessionStorage.removeItem('mk_songs_loaded');
    sessionStorage.removeItem('mk_total_liked');
    sessionStorage.removeItem('mk_selected_song');
    sessionStorage.removeItem('mk_song_info');
    sessionStorage.removeItem('mk_search_query');
    sessionStorage.removeItem('mk_search_results');
    sessionStorage.removeItem('mk_filter');
    sessionStorage.removeItem('mk_library_page');

    try {
      const me = await fetch('https://api.spotify.com/v1/me', {
        headers: {Authorization: 'Bearer ' + data.access_token}
      });
      const meData = await me.json();
      if (meData.id) {
        state.spotifyUserId = meData.id;
        sessionStorage.setItem('mk_uid', meData.id);
        const profile = {
          id: meData.id,
          name: meData.display_name || meData.id,
          email: meData.email || '',
          avatar: meData.images?.[0]?.url || meData.images?.[1]?.url || '',
          followers: meData.followers?.total ?? 0,
          product: meData.product || 'free',
          country: meData.country || '',
          uri: meData.external_urls?.spotify || '',
        };
        state.spotifyUser = profile;
        sessionStorage.setItem('mk_user', JSON.stringify(profile));
      }
    } catch(e) {  }
    window.history.replaceState({}, '', window.location.pathname);
    return true;
  }
  return false;
}

async function spotifyGet(path) {
  const r = await fetch('https://api.spotify.com/v1' + path, {
    headers: {Authorization: 'Bearer ' + state.token}
  });
  if (r.status === 401) { state.token=''; sessionStorage.removeItem('mk_token'); navigate('login'); return null; }
  if (!r.ok) return null;
  return r.json();
}

async function groqAPI(messages, systemPrompt = '') {
  const url = state.workerUrl;
  if (!url) throw new Error('Worker URL lipsă.');

  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-App-Secret': APP_SECRET,
    },
    // temperature: 0 cere modelului răspunsuri deterministice — aceleași pedale și
    // același tuning de fiecare dată pentru aceeași melodie (dacă worker-ul îl pasează).
    body: JSON.stringify({ messages, systemPrompt, temperature: 0 }),
  });

  if (r.status === 403) throw new Error('Acces refuzat.');
  if (r.status === 429) throw new Error('Prea multe cereri — mai încet!');
  if (!r.ok) {
    const err = await r.text();
    throw new Error(`Worker error ${r.status}: ${err}`);
  }

  const data = await r.json();
  return data.text;
}

// SONGSTERR TUNING API
// Sursa REALA pentru tuningul fiecarei melodii (in loc de AI care halucineaza).
// Endpoint-uri folosite (descoperite din teaqu/guitar-pro-youtube-sync si breeku/songsterr-api-node):
//   1. /a/ra/songs.json?pattern=X       → search; returneaza array de melodii cu id
//   2. /api/meta/{songId}               → metadata complet, inclusiv tracks[i].tuning (MIDI array)
// Tuning-ul vine ca array de note MIDI: [40, 45, 50, 55, 59, 64] = E2 A2 D3 G3 B3 E4 (E Standard)
// Convertim la nume standard (E Standard, Drop D, Eb Standard, DADGAD, etc.).
// ════════════════════════════════════════════════════════════════════════════
const KNOWN_TUNINGS = {
  // 6-string (sortat low-to-high)
  '40,45,50,55,59,64': 'E Standard',
  '38,45,50,55,59,64': 'Drop D',
  '39,44,49,54,58,63': 'Eb Standard',
  '37,44,49,54,58,63': 'Drop C#',
  '38,43,48,53,57,62': 'D Standard',
  '36,43,48,53,57,62': 'Drop C',
  '37,42,47,52,56,61': 'C# Standard',
  '35,42,47,52,56,61': 'Drop B',
  '36,41,46,51,55,60': 'C Standard',
  '34,41,46,51,55,60': 'Drop Bb',
  '38,45,50,55,57,62': 'DADGAD',
  '38,43,50,55,59,62': 'Open G',
  '38,45,50,54,57,62': 'Open D',
  '40,47,52,56,59,64': 'Open E',
  '41,45,48,52,57,60': 'Open F',
  // 7-string
  '35,40,45,50,55,59,64': '7-string E Standard',
  '33,40,45,50,55,59,64': '7-string Drop A',
  '34,39,44,49,54,58,63': '7-string Eb',
  '32,39,44,49,54,58,63': '7-string Drop Ab',
  // 8-string
  '30,35,40,45,50,55,59,64': '8-string E Standard',
  '28,35,40,45,50,55,59,64': '8-string Drop E',
};

function midiToNoteName(midi) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[midi % 12];
}

function tuningArrayToName(midi) {
  if (!Array.isArray(midi) || midi.length < 4) return null;
  const sorted = [...midi].sort((a, b) => a - b);
  const key = sorted.join(',');
  if (KNOWN_TUNINGS[key]) return KNOWN_TUNINGS[key];
  // Tuning necunoscut → afisam notele individuale (low to high)
  return sorted.map(midiToNoteName).join(' ');
}

// Coada simpla cu rate limit ca sa nu bombardam proxy-ul gratuit
const _songsterrQueue = { running: 0, max: 2, delay: 350 };
function _songsterrSlot() {
  return new Promise(resolve => {
    const tryAcquire = () => {
      if (_songsterrQueue.running < _songsterrQueue.max) {
        _songsterrQueue.running++;
        resolve(() => {
          _songsterrQueue.running--;
        });
      } else {
        setTimeout(tryAcquire, 100);
      }
    };
    tryAcquire();
  });
}

async function fetchSongsterrTuning(song) {
  if (!song || !song.name || !song.artist) return;
  // Bump cache la v2 ca sa invalidam failures vechi din alte proxy-uri
  const cacheKey = 'mk_sst_tun_v2_' + song.id;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    if (cached !== '__NOT_FOUND__') {
      state.tunings[song.id] = cached;
      try { localStorage.setItem('mk_tunings_v3', JSON.stringify(state.tunings)); } catch {}
    }
    return;
  }

  const release = await _songsterrSlot();
  await new Promise(r => setTimeout(r, _songsterrQueue.delay));

  const cleanArtist = song.artist.split(',')[0].trim();
  const query = encodeURIComponent(`${song.name} ${cleanArtist}`);

  // Multiple proxy-uri ca failover — daca unul pica/blocheaza, incercam urmatorul
  const PROXIES = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
  ];

  async function fetchVia(url) {
    let lastErr;
    for (const proxy of PROXIES) {
      try {
        const r = await fetch(proxy(url));
        if (r.ok) return r;
        lastErr = new Error('proxy ' + r.status);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('all proxies failed');
  }

  try {
    // PAS 1: cautam melodia
    const sr = await fetchVia(`https://www.songsterr.com/a/ra/songs.json?pattern=${query}`);
    const songs = await sr.json();
    if (!Array.isArray(songs) || songs.length === 0) {
      localStorage.setItem(cacheKey, '__NOT_FOUND__');
      console.log('[Songsterr] no results for', song.name);
      return;
    }
    // Cautam un match cat mai exact pe titlu + artist
    const lowerName = song.name.toLowerCase();
    const lowerArtist = cleanArtist.toLowerCase();
    // Filtram tabs care contin ambele cuvinte critice
    const candidates = songs.filter(s =>
      s.title?.toLowerCase().includes(lowerName) &&
      s.artist?.name?.toLowerCase().includes(lowerArtist.split(' ')[0])
    );
    const matched = candidates[0] || songs[0];
    const songId = matched.id || matched.songId;
    if (!songId) {
      localStorage.setItem(cacheKey, '__NOT_FOUND__');
      return;
    }

    // PAS 2: preluam metadata cu tracks + tuning
    const mr = await fetchVia(`https://www.songsterr.com/api/meta/${songId}`);
    const meta = await mr.json();
    const tracks = meta.tracks || meta.revision?.tracks || [];
    if (!tracks.length) {
      localStorage.setItem(cacheKey, '__NOT_FOUND__');
      return;
    }

    // Gasim primul track de chitara (ignoram drums, bass, voice)
    const guitarTrack = tracks.find(t => {
      const inst = (t.instrument || t.name || '').toLowerCase();
      return /guitar|gtr/.test(inst) && !/bass/.test(inst);
    }) || tracks.find(t => Array.isArray(t.tuning) && t.tuning.length >= 6)
       || tracks[0];

    if (!guitarTrack || !Array.isArray(guitarTrack.tuning)) {
      localStorage.setItem(cacheKey, '__NOT_FOUND__');
      return;
    }

    const tuningName = tuningArrayToName(guitarTrack.tuning);
    if (tuningName) {
      console.log('[Songsterr] ✓', song.name, '→', tuningName, '(MIDI:', guitarTrack.tuning, ')');
      state.tunings[song.id] = tuningName;
      localStorage.setItem(cacheKey, tuningName);
      try {
        localStorage.setItem('mk_tunings_v3', JSON.stringify(state.tunings));
      } catch {}
      render();
    }
  } catch (e) {
    // CORS sau retea — silentios, ramane fallback la AI fetchTuningsBatch
    console.warn('Songsterr tuning fail for', song.name, '—', e.message);
  } finally {
    release();
  }
}
