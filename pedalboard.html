        playBtn.textContent = '▶';
        fillEl.style.width = '0%';
        dotEl.style.left = '0%';
        timeEl.textContent = '0:00';
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); playBtn.textContent = '⏸'; }
        else { audio.pause(); playBtn.textContent = '▶'; }
      });

      let scrubbing = false;
      const scrub = e => {
        const rect = barWrap.querySelector('.rp-bar').getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration) audio.currentTime = pct * audio.duration;
        fillEl.style.width = (pct * 100) + '%';
        dotEl.style.left = (pct * 100) + '%';
      };
      barWrap.addEventListener('mousedown', e => { scrubbing = true; scrub(e); e.preventDefault(); });
      document.addEventListener('mousemove', e => { if (scrubbing) scrub(e); });
      document.addEventListener('mouseup', () => { scrubbing = false; });
      barWrap.addEventListener('touchstart', e => { scrub(e.touches[0]); e.preventDefault(); }, {passive:false});
      barWrap.addEventListener('touchmove', e => { scrub(e.touches[0]); e.preventDefault(); }, {passive:false});

      item.querySelector('.rec-del-btn').addEventListener('click', e => {
        audio.pause();
        const idx = parseInt(e.currentTarget.dataset.idx);
        const rec = state.recordings[idx];
        if (rec) {
          URL.revokeObjectURL(rec.url);
          // Ștergem și din IndexedDB ca să nu reapară la următorul refresh
          if (rec.dbId != null) deleteRecordingFromDB(rec.dbId);
        }
        state.recordings.splice(idx, 1);
        render();
      });
      list.appendChild(item);
    });

    recSec.appendChild(list);
    div.appendChild(recSec);
  }

  return div;
}

// ── TUNER PAGE ────────────────────────────────────────────────────────────────
// Tuninguri populare de pe Songsterr / Ultimate Guitar, grupate logic:
// Standard variations (down-tuned half/whole step), Drop tunings, Open tunings,
// Open minor tunings, Modal/alternate, și câteva exotice (All Fourths, NST).

// Generăm frecvențele tuturor notelor de la A0 la C8 matematic — formula
// f = 440 * 2^((midi-69)/12). Acoperă orice tuning posibil + aliasuri flat/sharp.
const NOTE_FREQS = (() => {
  const sharps = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const sharpToFlat = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
  const map = {};
  for (let midi = 21; midi <= 108; midi++) {      // A0 (21) → C8 (108)
    const freq    = 440 * Math.pow(2, (midi - 69) / 12);
    const note    = sharps[midi % 12];
    const octave  = Math.floor(midi / 12) - 1;
    map[note + octave] = freq;
    // alias flat pentru semitonuri (Db ≡ C#, Eb ≡ D#, etc.)
    if (sharpToFlat[note]) map[sharpToFlat[note] + octave] = freq;
  }
  return map;
})();

const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];

let tunerAudio = null;
let tunerAnalyser = null;
let tunerAnimFrame = null;

function freqToNote(freq) {
  // 35 Hz cuprinde și cele mai joase note de pe chitarele 6-corzi în Drop G/G#
  // (G1 ≈ 49 Hz, F#1 ≈ 46 Hz). Sub 35 Hz e sub-bass nedetectabil oricum.
  if (freq < 35) return {note:'--', cents:0, octave:''};
  const noteNum = 12 * Math.log2(freq / 440) + 69;
  const rounded = Math.round(noteNum);
  const cents = Math.round((noteNum - rounded) * 100);
  const name = CHROMATIC[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return {note: name, cents, octave};
}




function loopTuner() {
  if (!tunerAnalyser) return;
  const buf = new Float32Array(tunerAnalyser.fftSize);
  tunerAnalyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, tunerAnalyser.context.sampleRate);
  if (freq > 0) {
    const {note, cents, octave} = freqToNote(freq);
    tunerState.freq = freq;
    tunerState.note = note;
    tunerState.cents = cents;
    tunerState.octave = octave;
    updateTunerDisplay();
  }
  tunerAnimFrame = requestAnimationFrame(loopTuner);
}

function updateTunerDisplay() {
  const noteEl = document.getElementById('t-note');
  const freqEl = document.getElementById('t-freq');
  const centsEl = document.getElementById('t-cents');
  const needle = document.getElementById('t-needle');
  if (!noteEl) return;
  
  const {note, freq, cents} = tunerState;
  noteEl.textContent = note;
  freqEl.textContent = freq > 0 ? freq.toFixed(1) + ' Hz' : '';
  
  const inTune = Math.abs(cents) < 5;
  noteEl.className = 'tuner-note' + (inTune ? ' in-tune' : '');
  
  if (cents > 5) {
    centsEl.textContent = '+' + cents + t('cents_sharp');
    centsEl.className = 'tuner-cents sharp';
  } else if (cents < -5) {
    centsEl.textContent = cents + t('cents_flat');
    centsEl.className = 'tuner-cents flat';
  } else {
    centsEl.textContent = inTune && note!=='--' ? t('in_tune') : '';
    centsEl.className = 'tuner-cents intune';
  }
  
  if (needle) {
    const deg = Math.max(-45, Math.min(45, cents * 0.9));
    needle.style.transform = `translateX(-50%) rotate(${deg}deg)`;
  }
}


function playTone(freq, duration = 1.5) {
  if (!freq) return;
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'triangle';
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.start();
  osc.stop(ctx.currentTime + duration);
  // Închidem contextul după ce se termină nota, altfel se acumulează
  // (browserele limitează la ~6 AudioContext-uri active simultan).
  osc.onended = () => { try { ctx.close(); } catch {} };
}

// GLOBAL KEYBOARD SHORTCUTS
//   /  sau Ctrl+K — focuseaza search (sau navigheaza la pagina de search)
//   Shift+T      — toggle dark/light theme
//   Shift+L      — toggle limba RO/EN
// ══════════════════════════════════════════════════════════════════════════
function isTypingInInput() {
  const a = document.activeElement;
  if (!a) return false;
  const tag = a.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || a.isContentEditable;
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('mk_theme', next); } catch {}
  render();
}

function toggleLanguage() {
  const next = state.lang === 'ro' ? 'en' : 'ro';
  state.lang = next;
  localStorage.setItem('mk_lang', next);
  render();
}

function setupGlobalShortcuts() {
  document.addEventListener('keydown', (e) => {
    // Daca user-ul scrie in input/textarea, ignoram shortcut-urile globale
    if (isTypingInInput()) return;

    // / pentru search
    if (e.key === '/') {
      e.preventDefault();
      if (state.page === 'search' || state.page === 'library') {
        // Suntem deja pe o pagina cu search input — focuseaza-l
        const inp = document.querySelector('input[type="text"][placeholder*="ut" i], input[type="text"][placeholder*="search" i], #search-global-inp');
        if (inp) { inp.focus(); inp.select?.(); return; }
      }
      navigate('search');
      return;
    }

    // Shift+T = toggle tema
    if (e.shiftKey && e.key === 'T') {
      e.preventDefault();
      toggleTheme();
      return;
    }

    // Shift+L = toggle limba
    if (e.shiftKey && e.key === 'L') {
      e.preventDefault();
      toggleLanguage();
      return;
    }
  });
}

async function boot() {
  // Setup global keyboard shortcuts (functioneaza pe toate paginile)
  setupGlobalShortcuts();

  // Restaurează starea volatilă (selectedSong, songs cache, search, etc.)
  restoreVolatileState();

  // Încarcăm înregistrările persistate (IndexedDB) ÎNAINTE de primul render,
  // ca să apară imediat dacă utilizatorul se duce direct pe pedalboard.
  // Pe paginile non-pedalboard functia nu exista — guard cu typeof.
  if (typeof loadRecordingsFromDB === 'function') {
    try {
      const saved = await loadRecordingsFromDB();
      if (saved.length) state.recordings = saved;
    } catch (e) {
      console.warn('Load recordings failed:', e);
    }
  }

  // Determină pagina cerută de fișierul HTML curent
  const initialPage = window.__INITIAL_PAGE__ || 'login';

  // OAuth callback handling — funcționează doar pe index.html (redirect URI)
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code && state.clientId) {
    window.history.replaceState({}, '', window.location.pathname);
    const ok = await exchangeCode(code);
    if (ok) {
      // După login reușit, mergem la library
      navigate('library');
      return;
    }
  }

  // Dacă fișierul HTML cere pagina login (index.html)
  if (initialPage === 'login') {
    // Dacă utilizatorul e deja logat, redirect direct la library
    if (state.token) {
      navigate('library');
      return;
    }
    state.page = 'login';
    render();
    return;
  }

  // Pagini care necesită login Spotify real (library = melodii personale, profile = profil)
  // Demo mode NU mai are acces la library — utilizatorul e redirectionat la search.
  if (initialPage === 'library' && !state.token) {
    navigate('search');
    return;
  }
  if (initialPage === 'profile' && !state.token) {
    navigate('login');
    return;
  }

  // Pagina song are nevoie de o melodie selectată
  if (initialPage === 'song' && !state.selectedSong) {
    navigate(state.token ? 'library' : 'search');
    return;
  }

  // Dacă suntem pe pagina song, asigurăm că datele AI sunt încărcate.
  // Fetch-ul anterior (de pe library/search) a fost abandonat la navigare.
  if (initialPage === 'song' && state.selectedSong && !state.songInfo[state.selectedSong.id]) {
    fetchSongInfo(state.selectedSong); // re-randează automat la final
  }

  state.page = initialPage;
  render();

  // Dacă suntem pe library și nu avem melodii încărcate, le încărcăm în fundal
  // Dacă suntem pe library și (a) nu avem melodii deloc, sau (b) avem doar o parte
  // incarcata (utilizatorul a iesit din pagina inainte sa termine fetch-ul) → reia.
  if (initialPage === 'library' && state.token) {
    const needsFreshLoad = !state.songsLoaded;
    const needsResume = state.songsLoaded
                     && state._totalLiked > 0
                     && state.songs.length < state._totalLiked;
    if (needsFreshLoad || needsResume) {
      loadSongs().then(() => { if (state.page === 'library') render(); });
    }
  }
}
