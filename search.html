function lookupArtistTuning(artist) {
  if (!artist) return null;
  const clean = artist.toLowerCase().trim().split(',')[0].trim();
  // Exact match
  if (ARTIST_TUNINGS[clean]) return ARTIST_TUNINGS[clean];
  // Substring match (pentru cazuri ca "Slash feat. Myles Kennedy")
  for (const [key, tuning] of Object.entries(ARTIST_TUNINGS)) {
    if (clean.includes(key)) return tuning;
  }
  return null;
}

async function fetchTuningsBatch(songs) {
  // Pas 1: aplicam baza de date artist→tuning instant (cea mai sigura sursa)
  songs.forEach(s => {
    if (state.tunings[s.id]) return; // deja avem tuning
    const knownTuning = lookupArtistTuning(s.artist);
    if (knownTuning) {
      state.tunings[s.id] = knownTuning;
    }
  });
  try { localStorage.setItem('mk_tunings_v3', JSON.stringify(state.tunings)); } catch {}
  updateTuningTagsInDOM();

  // Pas 2: pentru artisti necunoscuti, intrebam AI cu un prompt SCURT si FORTE
  const unknowns = songs.filter(s => !state.tunings[s.id]);
  if (!unknowns.length) return;

  const batch = unknowns.slice(0, 8); // batch mic = focus mai bun pentru AI
  const list = batch.map(s => `${s.artist} — ${s.name}`).join('\n');

  const prompt = `Identify the guitar tuning used on the ORIGINAL STUDIO RECORDING of each song.

Return JSON: { "Artist — Song": "tuning" }

Valid tunings: "E Standard", "Eb Standard", "D Standard", "C# Standard", "C Standard", "B Standard", "Drop D", "Drop D#", "Drop C#", "Drop C", "Drop B", "Drop A", "DADGAD", "Open G", "Open D", "Open E", "7-string E Standard", "7-string Drop A", "8-string Drop E".

Default to "E Standard" only if you don't recognize the artist or song. If you know the artist generally uses a specific tuning, USE that — don't default.

Songs:
${list}

JSON only.`;

  try {
    const text = await groqAPI(
      [{role:'user', content: prompt}],
      'You are an expert in guitar tunings. Return ONLY valid JSON mapping each "Artist — Song" key to a tuning string.'
    );
    const match = text.match(/\{[\s\S]*\}/);
    if (match) {
      const obj = JSON.parse(match[0]);
      batch.forEach(s => {
        const key = `${s.artist} — ${s.name}`;
        if (obj[key]) state.tunings[s.id] = obj[key];
        // Fallback la cheia veche cu dash simplu, daca AI nu pune em-dash
        else if (obj[`${s.artist} - ${s.name}`]) state.tunings[s.id] = obj[`${s.artist} - ${s.name}`];
      });
      try { localStorage.setItem('mk_tunings_v3', JSON.stringify(state.tunings)); } catch {}
      updateTuningTagsInDOM();
      if (unknowns.length > batch.length) {
        setTimeout(() => fetchTuningsBatch(unknowns.slice(batch.length)), 500);
      }
    }
  } catch(e) {
    console.warn('Tuning fetch failed:', e.message);
  }
}

// Actualizează in-place toate tag-urile de tuning fără a re-randa pagina,
// astfel încât focus-ul din câmpul de search să nu se piardă.
function updateTuningTagsInDOM() {
  document.querySelectorAll('.tuning-tag[data-sid]').forEach(el => {
    const sid = el.dataset.sid;
    const tuning = state.tunings[sid];
    if (tuning && el.textContent.trim() !== tuning) {
      el.textContent = tuning;
      el.classList.remove('loading');
      el.dataset.tuning = tuning;
    }
  });
}


// Convertește descrieri text ("high", "medium-high", "minimal") la scor 0-10 ca string.
// Folosit ca fallback când AI-ul ignoră instrucțiunea "N/10".
function descToScore(str) {
  const s = String(str).toLowerCase().trim();
  if (s.includes('off') || s.includes('none') || s.includes('zero') || s.includes('no '))  return 0;
  if (s.includes('minimal') || s.includes('very low'))     return 1;
  if (s.includes('low'))                                    return 3;
  if (s.includes('medium-high') || s.includes('mid-high')) return 7;
  if (s.includes('medium') || s.includes('mid') || s.includes('moderate')) return 5;
  if (s.includes('high') && !s.includes('not'))            return 7;
  if (s.includes('max') || s.includes('full'))             return 10;
  const num = parseFloat(s);
  if (!isNaN(num)) return Math.max(0, Math.min(10, Math.round(num > 10 ? num/10 : num)));
  return null;
}

// Convertește o valoare amp settings ("7/10" sau "high" sau "7") la 0-1 pentru AE
function parseKnobValue(str) {
  if (str == null) return null;
  if (typeof str === 'number') return Math.max(0, Math.min(1, str > 1 ? str/10 : str));
  const m = String(str).match(/(\d+(?:\.\d+)?)\s*\/\s*10/);
  if (m) return Math.max(0, Math.min(1, parseFloat(m[1]) / 10));
  const score = descToScore(str);
  return score != null ? score / 10 : null;
}

// Escape HTML pentru a preveni XSS din nume melodii/artiști etc.
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ═════════════════════════════════════════════════════════════════════════════
// PLAYLISTS DATABASE — schema relationala client-side cu IndexedDB
// ═════════════════════════════════════════════════════════════════════════════
//
// Schema:
//
//   playlists (entitate principala)
//     ├── id           : auto-increment (cheie primara)
//     ├── name         : string (indexed pentru cautare)
//     ├── description  : string (optional)
//     ├── color        : string (#hex pentru cover gradient)
//     ├── createdAt    : timestamp
//     └── updatedAt    : timestamp
//
//   playlist_songs (tabel de jonctiune - relatie many-to-many intre playlists si melodii)
//     ├── id          : auto-increment (cheie primara)
//     ├── playlistId  : FK → playlists.id  (indexed)
//     ├── songId      : string (Spotify ID sau ID generat local)
//     ├── name        : string
//     ├── artist      : string
//     ├── album       : string
//     ├── image       : string (URL)
//     ├── source      : 'spotify' | 'search' | 'recording'
//     ├── position    : number (ordinea in playlist)
//     ├── addedAt     : timestamp
//     └── indexes: [playlistId], [playlistId, position], [songId]
//
//   play_history (istoricul redarii — pentru "Played recently")
//     ├── id        : auto-increment
//     ├── songId    : string (indexed)
//     ├── name      : string
//     ├── artist    : string
//     ├── image     : string
//     ├── source    : string
//     ├── playedAt  : timestamp (indexed pentru sortare descrescatoare)
//
// Operatii CRUD complete cu transactii atomice unde e necesar (delete playlist
// + toate melodiile asociate intr-o singura tranzactie, pentru consistenta).

const playlistsDB = (() => {
  const DB_NAME = 'musiknow_playlists_db';
  const DB_VERSION = 1;
  let dbInstance = null;

  function open() {
    if (dbInstance) return Promise.resolve(dbInstance);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { dbInstance = req.result; resolve(dbInstance); };
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // Tabela playlists
        if (!db.objectStoreNames.contains('playlists')) {
          const ps = db.createObjectStore('playlists', { keyPath: 'id', autoIncrement: true });
          ps.createIndex('name', 'name', { unique: false });
          ps.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
        // Tabela playlist_songs (jonctiune)
        if (!db.objectStoreNames.contains('playlist_songs')) {
          const pss = db.createObjectStore('playlist_songs', { keyPath: 'id', autoIncrement: true });
          pss.createIndex('playlistId', 'playlistId', { unique: false });
          pss.createIndex('playlist_position', ['playlistId', 'position'], { unique: false });
          pss.createIndex('songId', 'songId', { unique: false });
        }
        // Tabela play_history
        if (!db.objectStoreNames.contains('play_history')) {
          const ph = db.createObjectStore('play_history', { keyPath: 'id', autoIncrement: true });
          ph.createIndex('songId', 'songId', { unique: false });
          ph.createIndex('playedAt', 'playedAt', { unique: false });
        }
      };
    });
  }

  // CREATE — playlist nou
  async function createPlaylist(name, description = '', color = null, coverDataUrl = null) {
    if (!name || !String(name).trim()) throw new Error('Numele playlist-ului e obligatoriu');
    const safeName = String(name).trim().slice(0, 100); // limita lungime
    const safeDesc = String(description || '').slice(0, 500);
    // Genereaza o culoare aleatoare dintr-o paleta predefinita daca nu e specificata
    const colors = ['#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b','#ef4444','#6366f1','#84cc16'];
    const safeColor = color || colors[Math.floor(Math.random() * colors.length)];
    // Validare cover: trebuie sa fie data URL de imagine si max ~500KB ca lungime base64
    let safeCover = null;
    if (coverDataUrl && typeof coverDataUrl === 'string' &&
        coverDataUrl.startsWith('data:image/') && coverDataUrl.length < 700000) {
      safeCover = coverDataUrl;
    }
    const now = Date.now();
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('playlists', 'readwrite');
      const req = tx.objectStore('playlists').add({
        name: safeName, description: safeDesc, color: safeColor,
        coverDataUrl: safeCover,
        createdAt: now, updatedAt: now,
      });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // READ — listare playlists (sortate dupa updatedAt descrescator)
  async function listPlaylists() {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('playlists', 'readonly');
      const req = tx.objectStore('playlists').getAll();
      req.onsuccess = () => {
        const list = (req.result || []).sort((a, b) => b.updatedAt - a.updatedAt);
        resolve(list);
      };
      req.onerror = () => reject(req.error);
    });
  }

  // READ — un singur playlist cu melodiile lui
  async function getPlaylistWithSongs(playlistId) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['playlists', 'playlist_songs'], 'readonly');
      const plReq = tx.objectStore('playlists').get(playlistId);
      const songsReq = tx.objectStore('playlist_songs').index('playlistId').getAll(playlistId);
      let pl = null, songs = [];
      plReq.onsuccess = () => { pl = plReq.result; };
      songsReq.onsuccess = () => {
        songs = (songsReq.result || []).sort((a, b) => a.position - b.position);
      };
      tx.oncomplete = () => {
        if (!pl) return reject(new Error('Playlist not found'));
        resolve({ ...pl, songs });
      };
      tx.onerror = () => reject(tx.error);
    });
  }

  // UPDATE — redenumire playlist + descriere + cover image
  // - newDescription: null = nu schimba, string = update
  // - newCoverDataUrl: undefined = nu schimba, null = sterge, string = update
  async function renamePlaylist(playlistId, newName, newDescription = null, newCoverDataUrl = undefined) {
    if (!newName || !String(newName).trim()) throw new Error('Numele e obligatoriu');
    const safeName = String(newName).trim().slice(0, 100);
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('playlists', 'readwrite');
      const store = tx.objectStore('playlists');
      const getReq = store.get(playlistId);
      getReq.onsuccess = () => {
        const pl = getReq.result;
        if (!pl) return reject(new Error('Playlist not found'));
        pl.name = safeName;
        if (newDescription !== null) pl.description = String(newDescription || '').slice(0, 500);
        // Update cover doar daca s-a trecut explicit (undefined = pastreaza existentul)
        if (newCoverDataUrl !== undefined) {
          if (newCoverDataUrl === null) {
            pl.coverDataUrl = null;
          } else if (typeof newCoverDataUrl === 'string' &&
                     newCoverDataUrl.startsWith('data:image/') && newCoverDataUrl.length < 700000) {
            pl.coverDataUrl = newCoverDataUrl;
          }
        }
        pl.updatedAt = Date.now();
        const putReq = store.put(pl);
        putReq.onsuccess = () => resolve(pl);
        putReq.onerror = () => reject(putReq.error);
      };
      getReq.onerror = () => reject(getReq.error);
    });
  }

  // DELETE — sterge playlist + toate melodiile asociate (tranzactie atomica)
  async function deletePlaylist(playlistId) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['playlists', 'playlist_songs'], 'readwrite');
      const songsStore = tx.objectStore('playlist_songs');
      const idx = songsStore.index('playlistId');
      // Sterge toate melodiile asociate
      const cursorReq = idx.openCursor(IDBKeyRange.only(playlistId));
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          cursor.delete();
          cursor.continue();
        }
      };
      // Sterge playlist-ul
      tx.objectStore('playlists').delete(playlistId);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  // CREATE — adauga melodie in playlist (la sfarsit)
  async function addSongToPlaylist(playlistId, song) {
    if (!song || !song.id) throw new Error('Melodie invalida');
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['playlists', 'playlist_songs'], 'readwrite');
      const songsStore = tx.objectStore('playlist_songs');

      // Verifica daca melodia exista deja in playlist
      const idx = songsStore.index('playlistId');
      const existingReq = idx.getAll(playlistId);
      existingReq.onsuccess = () => {
        const existing = existingReq.result || [];
        if (existing.some(s => s.songId === song.id)) {
          return reject(new Error('DUPLICATE'));
        }
        // Calculeaza pozitia urmatoare (la sfarsit)
        const maxPos = existing.reduce((m, s) => Math.max(m, s.position || 0), -1);
        const entry = {
          playlistId,
          songId: song.id,
          name: String(song.name || '').slice(0, 200),
          artist: String(song.artist || '').slice(0, 200),
          album: String(song.album || '').slice(0, 200),
          image: String(song.image || '').slice(0, 500),
          source: String(song.source || 'spotify').slice(0, 20),
          position: maxPos + 1,
          addedAt: Date.now(),
        };
        songsStore.add(entry);
        // Actualizeaza updatedAt pe playlist
        const plStore = tx.objectStore('playlists');
        const plReq = plStore.get(playlistId);
        plReq.onsuccess = () => {
          const pl = plReq.result;
          if (pl) { pl.updatedAt = Date.now(); plStore.put(pl); }
        };
      };
      existingReq.onerror = () => reject(existingReq.error);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  // DELETE — sterge o melodie din playlist
  async function removeSongFromPlaylist(playlistId, songId) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['playlists', 'playlist_songs'], 'readwrite');
      const songsStore = tx.objectStore('playlist_songs');
      const idx = songsStore.index('playlistId');
      const cursorReq = idx.openCursor(IDBKeyRange.only(playlistId));
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.songId === songId) {
            cursor.delete();
          }
          cursor.continue();
        }
      };
      const plStore = tx.objectStore('playlists');
      const plReq = plStore.get(playlistId);
      plReq.onsuccess = () => {
        const pl = plReq.result;
        if (pl) { pl.updatedAt = Date.now(); plStore.put(pl); }
      };
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  // UPDATE — reordoneaza melodiile (drag-and-drop)
  async function reorderSongs(playlistId, orderedSongIds) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('playlist_songs', 'readwrite');
      const store = tx.objectStore('playlist_songs');
      const idx = store.index('playlistId');
      const cursorReq = idx.openCursor(IDBKeyRange.only(playlistId));
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const newPos = orderedSongIds.indexOf(cursor.value.songId);
          if (newPos !== -1 && newPos !== cursor.value.position) {
            const updated = { ...cursor.value, position: newPos };
            cursor.update(updated);
          }
          cursor.continue();
        }
      };
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  // CREATE — adauga in play_history (apelat cand se deschide o melodie)
  async function recordPlay(song) {
    if (!song || !song.id) return;
    const db = await open();
    return new Promise((resolve) => {
      const tx = db.transaction('play_history', 'readwrite');
      tx.objectStore('play_history').add({
        songId: song.id,
        name: String(song.name || '').slice(0, 200),
        artist: String(song.artist || '').slice(0, 200),
        image: String(song.image || '').slice(0, 500),
        source: String(song.source || 'spotify').slice(0, 20),
        playedAt: Date.now(),
      });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false); // nu cadem la eroare aici
    });
  }

  // READ — istoric recent (ultimele N intrari, unice dupa songId)
  async function getRecentPlays(limit = 20) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('play_history', 'readonly');
      const idx = tx.objectStore('play_history').index('playedAt');
      const cursorReq = idx.openCursor(null, 'prev'); // reverse chronological
      const seen = new Set();
      const out = [];
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor && out.length < limit) {
          if (!seen.has(cursor.value.songId)) {
            seen.add(cursor.value.songId);
            out.push(cursor.value);
          }
          cursor.continue();
        } else {
          resolve(out);
        }
      };
      cursorReq.onerror = () => reject(cursorReq.error);
    });
  }

  return {
    open,
    createPlaylist, listPlaylists, getPlaylistWithSongs,
    renamePlaylist, deletePlaylist,
    addSongToPlaylist, removeSongFromPlaylist, reorderSongs,
    recordPlay, getRecentPlays,
  };
})();

// Map între numele logic al paginii și fișierul HTML real
const PAGE_FILES = {
  login:      'index.html',
  library:    'library.html',
  search:     'search.html',
  song:       'song.html',
  pedalboard: 'pedalboard.html',
  tuner:      'tuner.html',
  signal:     'signal.html',
  profile:    'profile.html',
  playlists:  'playlists.html',
};

// Persistă starea volatilă în sessionStorage înainte de navigare,
// ca să o regăsim când se încarcă noua pagină.
function persistVolatileState() {
  try {
    if (state.selectedSong) sessionStorage.setItem('mk_selected_song', JSON.stringify(state.selectedSong));
    if (state.selectedPlaylistId) sessionStorage.setItem('mk_selected_playlist', String(state.selectedPlaylistId));
    if (state.songs?.length)    sessionStorage.setItem('mk_songs',    JSON.stringify(state.songs));
    if (state.topSongs?.length) sessionStorage.setItem('mk_topsongs', JSON.stringify(state.topSongs));
    if (state.songsLoaded) sessionStorage.setItem('mk_songs_loaded', '1');
    // _totalLiked este TOTALUL real al melodiilor like-uite (returnat de Spotify).
    // E nevoie persistat ca sa stim sa CONTINUAM incarcarea cand utilizatorul revine
    // pe library dupa ce a iesit in mijlocul fetch-ului (altfel ar crede ca e gata).
    if (state._totalLiked) sessionStorage.setItem('mk_total_liked', String(state._totalLiked));
    if (state.demoMode)    sessionStorage.setItem('mk_demo_mode', '1');
    if (state.searchQuery)        sessionStorage.setItem('mk_search_query',   state.searchQuery);
    if (state.searchResults?.length) sessionStorage.setItem('mk_search_results', JSON.stringify(state.searchResults));
    if (Object.keys(state.songInfo || {}).length) {
      // Persist doar info-urile non-loading ca să nu re-cerem după navigare
      const cleanInfo = {};
      for (const k in state.songInfo) if (state.songInfo[k] && !state.songInfo[k].error) cleanInfo[k] = state.songInfo[k];
      if (Object.keys(cleanInfo).length) sessionStorage.setItem('mk_song_info', JSON.stringify(cleanInfo));
    }
    if (state.tunerTargetTuning) sessionStorage.setItem('mk_tuner_target', state.tunerTargetTuning);
    if (state.filter) sessionStorage.setItem('mk_filter', JSON.stringify(state.filter));
    if (typeof state.libraryPage === 'number') sessionStorage.setItem('mk_library_page', String(state.libraryPage));
  } catch (e) { console.warn('persistVolatileState failed:', e); }
}

// Restaurează starea volatilă la încărcarea unei pagini noi
function restoreVolatileState() {
  try {
    const sel = sessionStorage.getItem('mk_selected_song');
    if (sel) state.selectedSong = JSON.parse(sel);
    const selPl = sessionStorage.getItem('mk_selected_playlist');
    if (selPl) state.selectedPlaylistId = parseInt(selPl, 10) || null;
    const songs = sessionStorage.getItem('mk_songs');
    if (songs) state.songs = JSON.parse(songs);
    const top = sessionStorage.getItem('mk_topsongs');
    if (top) state.topSongs = JSON.parse(top);
    if (sessionStorage.getItem('mk_songs_loaded') === '1') state.songsLoaded = true;
    const totalLiked = sessionStorage.getItem('mk_total_liked');
    if (totalLiked) state._totalLiked = parseInt(totalLiked, 10) || 0;
    if (sessionStorage.getItem('mk_demo_mode')    === '1') state.demoMode    = true;
    const sq = sessionStorage.getItem('mk_search_query');
    if (sq) state.searchQuery = sq;
    const sr = sessionStorage.getItem('mk_search_results');
    if (sr) state.searchResults = JSON.parse(sr);
    const si = sessionStorage.getItem('mk_song_info');
    if (si) state.songInfo = JSON.parse(si);
    const tt = sessionStorage.getItem('mk_tuner_target');
    if (tt) state.tunerTargetTuning = tt;
    const f = sessionStorage.getItem('mk_filter');
    if (f) state.filter = JSON.parse(f);
    const lp = sessionStorage.getItem('mk_library_page');
    if (lp) state.libraryPage = parseInt(lp, 10) || 0;
  } catch (e) { console.warn('restoreVolatileState failed:', e); }
}

function navigate(page, data = {}) {
  // Oprește audio-ul activ când utilizatorul iese de pe pagina care îl folosește,
  // altfel microfonul rămâne deschis după navigare.
  if (state.page === 'tuner' && page !== 'tuner' && typeof tunerState !== 'undefined' && tunerState.active) {
    stopTuner();
  }
  if (state.page === 'signal' && page !== 'signal' && typeof window.__sigStopMon === 'function') {
    try { window.__sigStopMon(); } catch {}
  }

  // Aplică datele suplimentare pe state ca să fie persistate corect
  Object.assign(state, data);
  state.page = page;
  persistVolatileState();

  // Dacă suntem deja pe pagina cerută (re-randare), nu mai navigăm
  const currentFile = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
  const targetFile  = PAGE_FILES[page] || 'index.html';
  if (currentFile === targetFile || (currentFile === '' && targetFile === 'index.html')) {
    render();
    return;
  }
  window.location.href = targetFile;
}

function render() {
  const app = $('app');
  app.innerHTML = '';
  
  if (state.page === 'login') { app.appendChild(renderLogin()); return; }

  const wrapper = el('div');
  wrapper.appendChild(renderHeader());
  
  // <main> cu id="main-content" — target pentru skip link, landmark pentru screen-readere
  const main = document.createElement('main');
  main.id = 'main-content';
  main.tabIndex = -1; // permite focus programatic pentru skip link, dar nu apare în tab order
  
  if (state.page === 'library') main.appendChild(renderLibrary());
  else if (state.page === 'search') main.appendChild(renderSearch());
  else if (state.page === 'song') main.appendChild(renderSong());
  else if (state.page === 'pedalboard') main.appendChild(renderPedalboard());
  else if (state.page === 'tuner') main.appendChild(renderTuner());
  else if (state.page === 'signal') main.appendChild(renderSignal());
  else if (state.page === 'profile') main.appendChild(renderProfile());
  else if (state.page === 'playlists') main.appendChild(renderPlaylists());
  
  wrapper.appendChild(main);
  app.appendChild(wrapper);
}

// ── PERSISTENȚĂ ÎNREGISTRĂRI (IndexedDB) ───────────────────────────────────────
// Blob-urile WAV sunt prea mari pentru localStorage (~5MB total). IndexedDB suportă
// blob-uri direct și are limită generoasă (de obicei câteva sute de MB).
const REC_DB_NAME    = 'musiknow_db';
const REC_DB_VERSION = 1;
const REC_STORE      = 'recordings';

function openRecDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(REC_DB_NAME, REC_DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(REC_STORE)) {
        db.createObjectStore(REC_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}




function distCurve(amount) {
  const n = 512, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    c[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
  }
  return c;
}
function fuzzCurve() {
  const n = 512, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    c[i] = Math.tanh(x * 20) * 0.7;
  }
  return c;
}
function hardClip(gain = 30) {
  const n = 512, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    c[i] = Math.max(-0.65, Math.min(0.65, x * gain)) / 0.65;
  }
  return c;
}
function makeIR(ctx, duration = 1.5, decay = 2.5) {
  const len = Math.floor(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}


const AE = {
  ctx: null, stream: null, src: null, analyser: null,
  inputGain: null, outputGain: null, bassF: null, midF: null, trebleF: null, cabF: null,
  nodes: {}, meterRaf: null, _lfoNodes: [],
  recDest: null, recorder: null, recChunks: [], recStartTime: null, recTimerRaf: null,

  async start() {
    try {
      // OPTIMIZARI LATENCY:
      // - channelCount:1 = mono (jumatate din date de procesat)
      // - sampleSize:16 = precizie 16-bit (suficient pentru chitara, mai putin buffering decat 24)
      // - echoCancellation/noiseSuppression/autoGainControl OFF = fiecare adauga buffering DSP
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
          sampleSize: 16,
        }
      });
      // sampleRate explicit la 48000 = rata native a majoritatii placilor audio,
      // evita resampling intre stream input si AudioContext (resampling = buffer suplimentar)
      // Detectam rata native de la track si o folosim daca disponibila
      const track = this.stream.getAudioTracks()[0];
      const settings = track?.getSettings?.() || {};
      const preferredSampleRate = settings.sampleRate || 48000;
      this.ctx = new AudioContext({
        latencyHint: 'interactive',
        sampleRate: preferredSampleRate,
      });
      await this.ctx.resume();
      this.src = this.ctx.createMediaStreamSource(this.stream);

      this.inputGain  = this.ctx.createGain();
      this.bassF      = this.ctx.createBiquadFilter();
      this.midF       = this.ctx.createBiquadFilter();
      this.trebleF    = this.ctx.createBiquadFilter();
      this.cabF       = this.ctx.createBiquadFilter();
      this.outputGain = this.ctx.createGain();
      this.analyser   = this.ctx.createAnalyser();
      // fftSize 128 (in loc de 256) = buffer mai mic = update mai rapid pe meter
      this.analyser.fftSize = 128;
      this.recDest    = this.ctx.createMediaStreamDestination();

      // ── MONITOR LIVE prin <audio> element ─────────────────────────────────
      // Bug cunoscut Chrome: când getUserMedia rulează cu echoCancellation:false
      // și output-ul se duce la ctx.destination, browser-ul activează anti-feedback
      // automat și suprimă output-ul live (dar nu și recDest, de aceea înregistrarea
      // are sunet iar live nu). Workaround: creăm un MediaStreamDestination separat,
      // îl alimentăm într-un <audio> element și acela produce sunetul. Audio element
      // nu intră în logica anti-feedback a browser-ului.
      this.monitorDest = this.ctx.createMediaStreamDestination();
      this.monitorEl   = new Audio();
      this.monitorEl.srcObject = this.monitorDest.stream;
      this.monitorEl.autoplay  = true;
      this.monitorEl.muted     = false;
      // OPTIMIZARI LATENCY pe audio element:
      // - preservesPitch=false = dezactiveaza algoritm de corectie pitch (buffer suplimentar)
      // - playbackRate=1.0 explicit = nu permite resampling tempo
      this.monitorEl.preservesPitch = false;
      this.monitorEl.playbackRate   = 1.0;
      // CRITICAL pe Firefox: elementul audio trebuie atașat la DOM ca să producă sunet.
      // Pe Chrome merge și fără DOM, dar pe Firefox `new Audio()` cu srcObject
      // setat la un MediaStream din MediaStreamDestination rămâne mut dacă nu e attached.
      // De aceea apare warning-ul `mozAudioCaptured` — Firefox detectează stream-ul dar
      // nu îl rutează la speakers.
      this.monitorEl.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;';
      document.body.appendChild(this.monitorEl);
      // .play() poate fi blocat fără gestural user interaction — dar AE.start()
      // este apelat din click handler, deci ar trebui să meargă
      try {
        await this.monitorEl.play();
      } catch(e) {
        // Autoplay blocat — fallback la ctx.destination (ar putea funcționa pe device-uri
        // unde Chrome nu activează anti-feedback)
        console.warn('Monitor play() blocked, fallback to ctx.destination:', e);
        try { this.monitorEl.remove(); } catch {}
        this.monitorEl   = null;
        this.monitorDest = null;
      }

      this.bassF.type   = 'lowshelf';  this.bassF.frequency.value   = 200;
      this.midF.type    = 'peaking';   this.midF.frequency.value    = 900; this.midF.Q.value = 0.9;
      this.trebleF.type = 'highshelf'; this.trebleF.frequency.value = 3200;
      this.cabF.type    = 'lowpass';   this.cabF.frequency.value    = 5000; this.cabF.Q.value = 0.6;

      this.applyAmpParams();
      this.src.connect(this.inputGain);
      this.src.connect(this.analyser);
      this.buildAllNodes();
      this.rebuildChain();
      this.startMeter();
      return true;
    } catch (e) {
      console.error('AE start error:', e);
      return false;
    }
  },

  stop() {
    if (this.recorder && this.recorder.state !== 'inactive') this.recorder.stop();
    this.stopMeter();
    this._lfoNodes.forEach(n => { try { n.stop(); } catch {} });
    this._lfoNodes = [];
    // Oprește și cleanup audio monitor element
    if (this.monitorEl) {
      try {
        this.monitorEl.pause();
        this.monitorEl.srcObject = null;
        this.monitorEl.remove();   // detach from DOM
      } catch {}
    }
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx)    this.ctx.close();
    this.ctx = this.stream = this.src = this.recDest = this.recorder = null;
    this.monitorDest = this.monitorEl = null;
    this.nodes = {};
  },

  applyAmpParams() {
    const p = state.ampParams;
    if (!this.ctx) return;
    this.inputGain.gain.value    = p.inputGain * 3 + 0.1;
    this.bassF.gain.value        = (p.bass   - 0.5) * 24;
    this.midF.gain.value         = (p.mid    - 0.5) * 18;
    this.trebleF.gain.value      = (p.treble - 0.5) * 18;
    this.outputGain.gain.value   = state.ampOn ? p.volume * 1.6 : 0;
  },

  setAmpParam(k, v) {
    state.ampParams[k] = v;
    savePedalState();
    if (k === 'cabSim') { this.rebuildChain(); return; }
    this.applyAmpParams();
  },

  setAmpPower(on) {
    state.ampOn = on;
    savePedalState();
    if (!this.outputGain) return;
    this.outputGain.gain.setTargetAtTime(on ? state.ampParams.volume * 1.6 : 0, this.ctx.currentTime, 0.02);
  },

  buildAllNodes() {
    this._lfoNodes.forEach(n => { try { n.stop(); } catch {} });
    this._lfoNodes = [];
    this.nodes = {};
    state.pedalboard.forEach(p => {
      if (p.displayOnly) return; // skip non-audio pedals
      try { this.nodes[p.id] = this._makeNodes(p); } catch (e) { console.warn('node build fail', p.id, e); }
    });
  },

  rebuildChain() {
    if (!this.ctx) return;
    const safeDisc = n => { try { n.disconnect(); } catch {} };
    safeDisc(this.inputGain);
    Object.values(this.nodes).forEach(n => { if(n){safeDisc(n.output);} });
    safeDisc(this.bassF); safeDisc(this.midF); safeDisc(this.trebleF);
    safeDisc(this.cabF); safeDisc(this.outputGain); safeDisc(this.analyser);

    let last = this.inputGain;
    state.pedalboard.filter(p => p.on && !p.displayOnly).forEach(p => {
      const n = this.nodes[p.id];
      if (n) { last.connect(n.input); last = n.output; }
    });
    last.connect(this.bassF);
    this.bassF.connect(this.midF);
    this.midF.connect(this.trebleF);
    const preOut = state.ampParams.cabSim ? this.cabF : this.outputGain;
    this.trebleF.connect(preOut);
    if (state.ampParams.cabSim) this.cabF.connect(this.outputGain);

    // Ruta de output live — utilizatorul poate comuta între 3 moduri din UI:
    //   'monitor'     → doar <audio> element (ocolește Chrome anti-feedback)
    //   'destination' → doar ctx.destination (latency mică, dar Chrome poate mute)
    //   'both'        → ambele (dublu volum dacă ambele merg, dar garanție max audibilitate)
    const mode = state.audioOutMode || 'monitor';
    if ((mode === 'monitor' || mode === 'both') && this.monitorDest) {
      try { this.outputGain.connect(this.monitorDest); } catch(e) {}
    }
    if ((mode === 'destination' || mode === 'both') || !this.monitorDest) {
      try { this.outputGain.connect(this.ctx.destination); } catch(e) { console.warn('Output blocked:', e); }
    }
    // Înregistrarea folosește recDest separat (a funcționat tot timpul)
    if (this.recDest) { try { this.outputGain.connect(this.recDest); } catch(e) {} }
  },

  startRecording() {
    if (!this.ctx || !this.recDest) return false;

    // SILENT RECORD: deconectam outputGain de la monitor si destination ca utilizatorul
    // sa nu mai auda semnalul procesat (no delay). recDest ramane conectat — captura merge.
    // Metronomul are propriul AudioContext, deci nu e afectat de aceasta deconectare.
    this._wasSilent = false;
    if (state.silentRecord) {
      try { this.outputGain.disconnect(this.ctx.destination); } catch(e) {}
      if (this.monitorDest) { try { this.outputGain.disconnect(this.monitorDest); } catch(e) {} }
      this._wasSilent = true;
    }

    this.recChunks = [];
    this.recorder = new MediaRecorder(this.recDest.stream);
    
    this.recorder.ondataavailable = e => { if (e.data.size > 0) this.recChunks.push(e.data); };
    
    this.recorder.onstop = async () => {
      const blob = new Blob(this.recChunks, { type: this.recorder.mimeType });
      const dur  = ((Date.now() - this.recStartTime) / 1000).toFixed(1);
      const name = `Take ${state.recordings.length + 1} — ${new Date().toLocaleTimeString()}`;

      let recObj;
      try {
        const arrayBuf = await blob.arrayBuffer();
        const audioBuf = await this.ctx.decodeAudioData(arrayBuf);
        const wavBlob  = bufferToWav(audioBuf);
        const url = URL.createObjectURL(wavBlob);
        recObj = { url, name, dur, blob: wavBlob, mime: 'audio/wav', ext: 'wav' };
      } catch(e) {
        console.warn('Eroare conversie WAV:', e);
        const url = URL.createObjectURL(blob);
        recObj = { url, name, dur, blob, mime: this.recorder.mimeType, ext: 'webm' };
      }

      // Persistăm în IndexedDB ca să supraviețuiască la refresh
      const dbId = await saveRecordingToDB(recObj);
      if (dbId != null) recObj.dbId = dbId;
      state.recordings.unshift(recObj);

      // Daca a fost silent record, reconectam outputGain la monitor + destination
      // ca utilizatorul sa auda din nou semnalul (cu delay, dar e ok cand nu inregistreaza)
      if (this._wasSilent) {
        const mode = state.audioOutMode || 'monitor';
        if ((mode === 'monitor' || mode === 'both') && this.monitorDest) {
          try { this.outputGain.connect(this.monitorDest); } catch(e) {}
        }
        if ((mode === 'destination' || mode === 'both') || !this.monitorDest) {
          try { this.outputGain.connect(this.ctx.destination); } catch(e) {}
        }
        this._wasSilent = false;
      }
      render();
    };
    
    this.recorder.start(); 
    this.recStartTime = Date.now();
    this._tickRecTimer();
    return true;
  },

  stopRecording() {
    if (this.recTimerRaf) cancelAnimationFrame(this.recTimerRaf);
    if (this.recorder && this.recorder.state !== 'inactive') this.recorder.stop();
  },

  _tickRecTimer() {
    const el = document.getElementById('rec-timer');
    if (el && this.recorder?.state === 'recording') {
      const s = (Date.now() - this.recStartTime) / 1000;
      el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
      this.recTimerRaf = requestAnimationFrame(() => this._tickRecTimer());
    }
  },

  isRecording() { return this.recorder?.state === 'recording'; },

  updateParam(pid, name, val) {
    const n = this.nodes[pid];
    if (n?.params?.[name]) n.params[name](val);
  },

  startMeter() {
    const tick = () => {
      const el = document.getElementById('level-fill');
      if (el && this.analyser) {
        const buf = new Float32Array(this.analyser.fftSize);
        this.analyser.getFloatTimeDomainData(buf);
        let rms = 0;
        buf.forEach(v => rms += v * v);
        rms = Math.sqrt(rms / buf.length);
        el.style.width = Math.min(100, rms * 700) + '%';
      }
      this.meterRaf = requestAnimationFrame(tick);
    };
    this.meterRaf = requestAnimationFrame(tick);
  },

  stopMeter() { if (this.meterRaf) cancelAnimationFrame(this.meterRaf); },

  _lfo(freq, amount, target) {
    const osc  = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = amount;
    osc.connect(gain);
    gain.connect(target);
    osc.start();
    this._lfoNodes.push(osc);
    return { osc, gain };
  },

  _makeNodes(pedal) {
    const ctx = this.ctx;
    const vals = state.pedalValues[pedal.id] || {};
    const v = (k, def) => (vals[k] !== undefined ? vals[k] : def);

    const wire = (...nodes) => { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i+1]); };
    const gain = (val) => { const g = ctx.createGain(); g.gain.value = val; return g; };
    const shaper = (curve) => { const w = ctx.createWaveShaper(); w.curve = curve; w.oversample = '4x'; return w; };
    const bq = (type, freq, q, gn) => {
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      if (q  !== undefined) f.Q.value    = q;
      if (gn !== undefined) f.gain.value = gn;
      return f;
    };

    switch (pedal.id) {

      case 'ts808': {
        const inp = gain(1), out = gain(v('level',0.7) * 1.5);
        const pre = gain(v('drive',0.5) * 60 + 2);
        const ws  = shaper(distCurve(v('drive',0.5) * 500 + 80));
        const tone = bq('highshelf', 3500, undefined, (v('tone',0.5)-0.5)*22);
        wire(inp, pre, ws, tone, out);
        return { input:inp, output:out, params:{
          drive: x => { pre.gain.value = x*60+2; ws.curve = distCurve(x*500+80); },
          tone:  x => { tone.gain.value = (x-0.5)*22; },
          level: x => { out.gain.value = x*1.5; },
        }};
      }

      case 'bigmuff': {
        const inp = gain(1), out = gain(v('vol',0.7)*1.5);
        const pre  = gain(v('sustain',0.7)*90 + 4);
        const ws1  = shaper(fuzzCurve());
        const ws2  = shaper(fuzzCurve());
        const notch = bq('notch', 1000 - v('tone',0.5)*700, 0.8);
        wire(inp, pre, ws1, ws2, notch, out);
        return { input:inp, output:out, params:{
          vol:     x => { out.gain.value = x*1.5; },
          tone:    x => { notch.frequency.value = 1000 - x*700; },
          sustain: x => { pre.gain.value = x*90+4; },
        }};
      }

      case 'ds1': {
        const inp = gain(1), out = gain(v('level',0.7)*1.5);
        const pre  = gain(v('dist',0.5)*140 + 2);
        const ws   = shaper(hardClip(30));
        const tone = bq('peaking', 1400, 1.2, (v('tone',0.5)-0.5)*22);
        wire(inp, pre, ws, tone, out);
        return { input:inp, output:out, params:{
          level: x => { out.gain.value = x*1.5; },
          tone:  x => { tone.gain.value = (x-0.5)*22; },
          dist:  x => { pre.gain.value = x*140+2; ws.curve = hardClip(x*50+10); },
        }};
      }

      case 'crybaby': {
        const inp = gain(1), out = gain(1);
        const filt = bq('bandpass', 200 + v('freq',0.5)*1800, 3 + v('Q',0.5)*8);
        const dry  = gain(0.4), wet  = gain(0.8), mix = gain(1);
        inp.connect(dry); dry.connect(mix);
        inp.connect(filt); filt.connect(wet); wet.connect(mix);
        mix.connect(out);
        return { input:inp, output:out, params:{
          freq: x => { filt.frequency.value = 200 + x*1800; },
          Q:    x => { filt.Q.value = 3 + x*8; },
        }};
      }

      case 'dd3': {
        const inp = gain(1), out = gain(1);
        const dly  = ctx.createDelay(2.0); dly.delayTime.value = v('D.Time',0.3)*0.75;
        const fb   = gain(Math.min(v('F.Back',0.35)*0.92, 0.91));
        const wg   = gain(v('E.Level',0.5));
        const drg  = gain(1.0);
        inp.connect(drg); drg.connect(out);
        inp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wg); wg.connect(out);
        return { input:inp, output:out, params:{
          'E.Level': x => { wg.gain.value = x; },
          'F.Back':  x => { fb.gain.value = Math.min(x*0.92, 0.91); },
          'D.Time':  x => { dly.delayTime.setTargetAtTime(x*0.75, ctx.currentTime, 0.01); },
        }};
      }

      case 'hof': {
        const inp = gain(1), out = gain(1);
        const conv = ctx.createConvolver();
        conv.buffer = makeIR(ctx, v('Decay',0.5)*3 + 0.4, 2.5);
        const wg = gain(v('FX Lvl',0.4)), drg = gain(1);
        inp.connect(drg); drg.connect(out);
        inp.connect(conv); conv.connect(wg); wg.connect(out);
        return { input:inp, output:out, params:{
          'FX Lvl': x => { wg.gain.value = x; },
          Decay:    x => { conv.buffer = makeIR(ctx, x*3+0.4, 2.5); },
          Tone:     x => {  },
        }};
      }

      case 'phase90': {
        const inp = gain(1), out = gain(1);
        const stages = [1,2,3,4].map(() => bq('allpass', 1000, 0.5));
        const dry = gain(0.5), wet = gain(0.5);
        inp.connect(dry); dry.connect(out);
        let last = inp; stages.forEach(s => { last.connect(s); last = s; });
        last.connect(wet); wet.connect(out);
        const { osc, gain: lg } = this._lfo(v('Speed',0.4)*4+0.1, 900, { connect: fn => stages.forEach(s => fn(s.frequency)) });
        const lfo2 = ctx.createOscillator(); lfo2.type = 'sine'; lfo2.frequency.value = v('Speed',0.4)*4+0.1;
        const lg2  = ctx.createGain(); lg2.gain.value = 900;
        lfo2.connect(lg2); stages.forEach(s => lg2.connect(s.frequency));
        lfo2.start(); this._lfoNodes.push(lfo2);
        return { input:inp, output:out, params:{
          Speed: x => { lfo2.frequency.value = x*4+0.1; },
        }};
      }

      case 'chorus': {
        const inp = gain(1), out = gain(1);
        const dly = ctx.createDelay(0.06); dly.delayTime.value = 0.02;
        const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = v('Rate',0.4)*3+0.2;
        const lg  = ctx.createGain(); lg.gain.value = v('Depth',0.5)*0.012+0.001;
        const wg  = gain(0.6), drg = gain(0.8);
        lfo.connect(lg); lg.connect(dly.delayTime);
        inp.connect(drg); drg.connect(out);
        inp.connect(dly); dly.connect(wg); wg.connect(out);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Rate:  x => { lfo.frequency.value = x*3+0.2; },
          Depth: x => { lg.gain.value = x*0.012+0.001; },
          Lo:    () => {}, Hi: () => {},
        }};
      }

      case 'comp': {
        const inp = gain(1), out = gain(v('Level',0.8)*1.4);
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -30 + v('Sustain',0.5)*22;
        comp.knee.value      = 10;
        comp.ratio.value     = 4  + v('Sustain',0.5)*10;
        comp.attack.value    = v('Attack',0.3)*0.1 + 0.001;
        comp.release.value   = 0.25;
        wire(inp, comp, out);
        return { input:inp, output:out, params:{
          Level:   x => { out.gain.value = x*1.4; },
          Sustain: x => { comp.threshold.value = -30+x*22; comp.ratio.value = 4+x*10; },
          Attack:  x => { comp.attack.value = x*0.1+0.001; },
          Tone:    () => {},
        }};
      }

      case 'flanger': {
        const inp = gain(1), out = gain(1);
        const dly = ctx.createDelay(0.02); dly.delayTime.value = 0.004;
        const fb  = gain(v('Regen',0.4)*0.72);
        const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = v('Rate',0.3)*2+0.05;
        const lg  = ctx.createGain(); lg.gain.value = 0.003;
        const wg  = gain(v('Mix',0.5)), drg = gain(1);
        lfo.connect(lg); lg.connect(dly.delayTime);
        inp.connect(drg); drg.connect(out);
        inp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wg); wg.connect(out);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Rate:  x => { lfo.frequency.value = x*2+0.05; },
          Width: x => { lg.gain.value = x*0.008+0.001; },
          Regen: x => { fb.gain.value = x*0.72; },
          Mix:   x => { wg.gain.value = x; },
        }};
      }

      default: {
        const inp = gain(1), out = gain(1);
        inp.connect(out);
        return { input:inp, output:out, params:{} };
      }

      case 'eq': {
        const inp = gain(1), out = gain(1);
        const freqs = [100, 200, 400, 800, 1600, 3200, 6400];
        const keys  = ['100Hz','200Hz','400Hz','800Hz','1.6k','3.2k','6.4k'];
        const filters = freqs.map((f, i) => bq('peaking', f, 2.5, (v(keys[i], 0.5) - 0.5) * 24));
        wire(inp, ...filters, out);
        const params = {};
        keys.forEach((k, i) => { params[k] = x => { filters[i].gain.value = (x - 0.5) * 24; }; });
        return { input:inp, output:out, params };
      }

      case 'octave': {
        const inp = gain(1), out = gain(1);
        const oct1g = gain(v('Oct1', 0.5));   // octave down
        const oct2g = gain(v('Oct2', 0.0));   // octave up (2nd harmonic)
        const dirg  = gain(v('Direct', 0.8)); // dry signal
        const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 80;
        const ring = ctx.createGain(); ring.gain.value = 0;
        osc.connect(ring.gain); // modulate gain with oscillator
        inp.connect(ring); ring.connect(oct1g); oct1g.connect(out);
        const rectCurve = new Float32Array(256);
        for (let i = 0; i < 256; i++) { const x = (i / 128) - 1; rectCurve[i] = Math.abs(x); }
        const rect = ctx.createWaveShaper(); rect.curve = rectCurve; rect.oversample = '4x';
        const rectG = ctx.createGain(); rectG.gain.value = 2;
        inp.connect(rect); rect.connect(rectG); rectG.connect(oct2g); oct2g.connect(out);
        inp.connect(dirg); dirg.connect(out);
        osc.start(); this._lfoNodes.push(osc);
        return { input:inp, output:out, params:{
          Oct1:   x => { oct1g.gain.value = x; },
          Oct2:   x => { oct2g.gain.value = x; },
          Direct: x => { dirg.gain.value = x; },
        }};
      }

      case 'tremolo': {
        const inp = gain(1), out = gain(1);
        const trem = ctx.createGain(); trem.gain.value = 1;
        const lfo  = ctx.createOscillator();
        const wave = v('Wave', 0.0) > 0.5 ? 'square' : 'sine';
        lfo.type = wave;
        lfo.frequency.value = v('Rate', 0.4) * 8 + 0.5;
        const depth = v('Depth', 0.6);
        const lfoGain = ctx.createGain(); lfoGain.gain.value = depth * 0.5;
        const dcOffset = ctx.createConstantSource(); dcOffset.offset.value = 1 - depth * 0.5;
        lfo.connect(lfoGain); lfoGain.connect(trem.gain);
        dcOffset.connect(trem.gain);
        inp.connect(trem); trem.connect(out);
        lfo.start(); dcOffset.start();
        this._lfoNodes.push(lfo, dcOffset);
        return { input:inp, output:out, params:{
          Rate:  x => { lfo.frequency.value = x * 8 + 0.5; },
          Depth: x => { lfoGain.gain.value = x * 0.5; dcOffset.offset.value = 1 - x * 0.5; },
          Wave:  x => { lfo.type = x > 0.5 ? 'square' : 'sine'; },
        }};
      }

      case 'boost': {
        const inp = gain(1), out = gain(v('Output', 0.7) * 3 + 0.5);
        const tone = bq('highshelf', 3000, undefined, (v('Tone', 0.5) - 0.5) * 16);
        wire(inp, tone, out);
        return { input:inp, output:out, params:{
          Output: x => { out.gain.value = x * 3 + 0.5; },
          Tone:   x => { tone.gain.value = (x - 0.5) * 16; },
        }};
      }

      case 'autowah': {
        const inp = gain(1), out = gain(1);
        const env  = ctx.createDynamicsCompressor();
        env.threshold.value = -50; env.ratio.value = 20; env.attack.value = 0.003; env.release.value = 0.1;
        const filt = bq('bandpass', 800, v('Q', 0.5) * 10 + 2);
        const drv  = gain(v('Drive', 0.5) * 8 + 1);
        const wg   = gain(v('Volume', 0.7));
        const dry  = gain(0.3), wetmix = gain(1);
        inp.connect(drv); drv.connect(env); env.connect(filt); filt.connect(wg); wg.connect(wetmix);
        inp.connect(dry); dry.connect(wetmix); wetmix.connect(out);
        return { input:inp, output:out, params:{
          Q:      x => { filt.Q.value = x * 10 + 2; },
          Drive:  x => { drv.gain.value = x * 8 + 1; },
          Volume: x => { wg.gain.value = x; },
        }};
      }

      case 'univibe': {
        const inp = gain(1), out = gain(1);
        const stages = [300, 600, 900, 1200].map(f => bq('allpass', f, 1.2));
        const dry = gain(0.5), wet = gain(0.5);
        inp.connect(dry); dry.connect(out);
        let last = inp; stages.forEach(s => { last.connect(s); last = s; });
        last.connect(wet); wet.connect(out);
        const lfo = ctx.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = v('Speed', 0.3) * 5 + 0.3;
        const lg = ctx.createGain(); lg.gain.value = v('Intensity', 0.5) * 600 + 100;
        lfo.connect(lg);
        stages.forEach(s => lg.connect(s.frequency));
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Speed:     x => { lfo.frequency.value = x * 5 + 0.3; },
          Intensity: x => { lg.gain.value = x * 600 + 100; },
        }};
      }

      case 'bitcrusher': {
        const inp = gain(1), out = gain(v('Mix', 0.7));
        const bits  = Math.round(v('Depth', 0.5) * 6 + 2); // 2–8 bits
        const steps = Math.pow(2, bits);
        const bcCurve = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
          const x = (i / 128) - 1;
          bcCurve[i] = Math.round(x * steps) / steps;
        }
        const bc  = ctx.createWaveShaper(); bc.curve = bcCurve; bc.oversample = 'none';
        const sampleDly = ctx.createDelay(0.02);
        sampleDly.delayTime.value = (1 - v('Sample', 0.8)) * 0.015 + 0.0005;
        const dry = gain(0.3);
        inp.connect(bc); bc.connect(sampleDly); sampleDly.connect(out);
        inp.connect(dry); dry.connect(out);
        return { input:inp, output:out, params:{
          Sample: x => { sampleDly.delayTime.value = (1 - x) * 0.015 + 0.0005; },
          Depth:  x => {
            const b = Math.round(x * 6 + 2);
            const s = Math.pow(2, b);
            const c = new Float32Array(256);
            for (let i = 0; i < 256; i++) { const v2 = (i/128)-1; c[i] = Math.round(v2*s)/s; }
            bc.curve = c;
          },
          Mix: x => { out.gain.value = x; },
        }};
      }

      case 'pitchshift': {
        const inp = gain(1), out = gain(1);
        const semitones = (v('Pitch', 0.5) - 0.5) * 24; // ±12 semitones
        const fine      = (v('Fine', 0.5) - 0.5) * 2;   // ±1 semitone fine
        const totalSemi = semitones + fine;
        const ratio     = Math.pow(2, totalSemi / 12);
        const dly1 = ctx.createDelay(0.1); dly1.delayTime.value = 0.02;
        const dly2 = ctx.createDelay(0.1); dly2.delayTime.value = 0.02;
        const lfo1 = ctx.createOscillator(); lfo1.type = 'sawtooth';
        lfo1.frequency.value = Math.abs(ratio - 1) * 10 + 1;
        const lfo2 = ctx.createOscillator(); lfo2.type = 'sawtooth';
        lfo2.frequency.value = lfo1.frequency.value;
        const lg1 = ctx.createGain(); lg1.gain.value = ratio > 1 ? -0.018 : 0.018;
        const lg2 = ctx.createGain(); lg2.gain.value = lg1.gain.value;
        const dc1 = ctx.createConstantSource(); dc1.offset.value = 0.02;
        const dc2 = ctx.createConstantSource(); dc2.offset.value = 0.02;
        lfo1.connect(lg1); lg1.connect(dly1.delayTime); dc1.connect(dly1.delayTime);
        lfo2.connect(lg2); lg2.connect(dly2.delayTime); dc2.connect(dly2.delayTime);
        const wg = gain(v('Balance', 0.5)), drg = gain(1 - v('Balance', 0.5));
        inp.connect(dly1); inp.connect(dly2);
        dly1.connect(wg); dly2.connect(wg); wg.connect(out);
        inp.connect(drg); drg.connect(out);
        lfo1.start(); lfo2.start(); dc1.start(); dc2.start();
        this._lfoNodes.push(lfo1, lfo2, dc1, dc2);
        const rebuildPitch = (semi, fine2) => {
          const r = Math.pow(2, (semi + fine2) / 12);
          const f = Math.abs(r - 1) * 10 + 1;
          lfo1.frequency.value = f; lfo2.frequency.value = f;
          lg1.gain.value = r > 1 ? -0.018 : 0.018;
          lg2.gain.value = lg1.gain.value;
        };
        let _semi = semitones, _fine = fine;
        return { input:inp, output:out, params:{
          Pitch:   x => { _semi = (x - 0.5) * 24; rebuildPitch(_semi, _fine); },
          Fine:    x => { _fine = (x - 0.5) * 2;  rebuildPitch(_semi, _fine); },
          Balance: x => { wg.gain.value = x; drg.gain.value = 1 - x; },
        }};
      }


      case 'dime_dist': {
        const inp = gain(1), out = gain(v('Out', 0.7) * 1.8);
        const pre  = gain(v('Gain', 0.8) * 120 + 5);
        const ws   = shaper(distCurve(v('Gain', 0.8) * 800 + 100));
        const lo   = bq('lowshelf',  100,  undefined, (v('Low',  0.5) - 0.5) * 20);
        const mid  = bq('peaking',   750,  1.5,       (v('Mid',  0.3) - 0.5) * 24); // scooped mids default
        const hi   = bq('highshelf', 4000, undefined, (v('High', 0.6) - 0.5) * 20);
        wire(inp, pre, ws, lo, mid, hi, out);
        return { input:inp, output:out, params:{
          Gain: x => { pre.gain.value = x*120+5; ws.curve = distCurve(x*800+100); },
          Low:  x => { lo.gain.value  = (x-0.5)*20; },
          Mid:  x => { mid.gain.value = (x-0.5)*24; },
          High: x => { hi.gain.value  = (x-0.5)*20; },
          Out:  x => { out.gain.value = x*1.8; },
        }};
      }

      case 'noisegate': {
        const inp = gain(1), out = gain(1);
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -80 + v('Threshold', 0.4) * 60; // -80 to -20 dB
        comp.knee.value   = 0;
        comp.ratio.value  = 20;
        comp.attack.value = 0.001;
        comp.release.value = v('Release', 0.3) * 0.4 + 0.05;
        wire(inp, comp, out);
        return { input:inp, output:out, params:{
          Threshold: x => { comp.threshold.value = -80 + x*60; },
          Release:   x => { comp.release.value   = x*0.4+0.05; },
        }};
      }

      case 'looper': {
        // Looper RC-5: înregistrează în buffer un loop și îl redă continuu.
        // Bypass-ul (apăsarea pe butonul mare al pedalei) controlează starea:
        // primul click = rec, al doilea = play, al treilea = overdub, ținut = clear.
        // Aici folosim un model mai simplu: cât timp pedala este ON, loop-ul rulează;
        // semnalul dry trece mereu, semnalul loop e adăugat peste.
        const inp = gain(1), out = gain(1);
        const dryG = gain(1);
        const loopDelay = ctx.createDelay(8.0); // până la 8 secunde de loop
        const loopFb    = gain(Math.min(v('Decay', 0.95) * 0.99, 0.99)); // 0.99 = loop quasi-infinit
        const loopMix   = gain(v('Mix', 0.55));
        const levelOut  = gain(v('Level', 0.85) * 1.4);
        loopDelay.delayTime.value = 2.0; // 2 sec default loop length
        inp.connect(dryG); dryG.connect(levelOut);
        // Bucla: input → delay → feedback → delay (creează loop) → mix → out
        inp.connect(loopDelay);
        loopDelay.connect(loopFb); loopFb.connect(loopDelay);
        loopDelay.connect(loopMix); loopMix.connect(levelOut);
        levelOut.connect(out);
        return { input:inp, output:out, params:{
          Level: x => { levelOut.gain.value = x*1.4; },
          Decay: x => { loopFb.gain.value = Math.min(x*0.99, 0.99); },
          Mix:   x => { loopMix.gain.value = x; },
        }};
      }

      case 'tuner_ped': {
        // Tuner TU-3: în viața reală, când e activat (ON), pedala mută complet semnalul
        // pentru ca să poți acorda în liniște. Reproducem exact acest comportament:
        // ON = output mut (gain 0), OFF = semnalul trece nemodificat.
        // Knob-ul "Mute" controlează cât de tare cade volumul când e activ (0 = silent total, 1 = trece).
        const inp = gain(1), out = gain(v('Mute', 0.0));
        wire(inp, out);
        return { input:inp, output:out, params:{
          Mute: x => { out.gain.value = x; },
        }};
      }

      case 'whammy': {
        const inp = gain(1), out = gain(1);
        const range   = v('Range', 0.5); // 0=octave down, 0.5=unison, 1=octave up
        const semis   = (range - 0.5) * 24;
        const ratio   = Math.pow(2, semis / 12);
        const speed   = Math.abs(ratio - 1) * 12 + 0.5;
        const dly     = ctx.createDelay(0.1); dly.delayTime.value = 0.02;
        const lfo     = ctx.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = speed;
        const lg      = ctx.createGain(); lg.gain.value = ratio > 1 ? -0.018 : 0.018;
        const dc      = ctx.createConstantSource(); dc.offset.value = 0.025;
        lfo.connect(lg); lg.connect(dly.delayTime); dc.connect(dly.delayTime);
        const wet = gain(v('Mix', 0.9)), dry = gain(1 - v('Mix', 0.9));
        inp.connect(dly); dly.connect(wet); wet.connect(out);
        inp.connect(dry); dry.connect(out);
        lfo.start(); dc.start(); this._lfoNodes.push(lfo, dc);
        let _range = range;
        const rebuild = r => {
          const s = (r - 0.5) * 24;
          const rt = Math.pow(2, s / 12);
          lfo.frequency.value = Math.abs(rt - 1) * 12 + 0.5;
          lg.gain.value = rt > 1 ? -0.018 : 0.018;
        };
        return { input:inp, output:out, params:{
          Range: x => { _range = x; rebuild(x); },
          Mix:   x => { wet.gain.value = x; dry.gain.value = 1 - x; },
        }};
      }

      case 'doubler': {
        const inp = gain(1), out = gain(1);
        const dly1 = ctx.createDelay(0.05); dly1.delayTime.value = 0.008;
        const dly2 = ctx.createDelay(0.05); dly2.delayTime.value = 0.012;
        const lfo  = ctx.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = v('Speed', 0.15) * 0.5 + 0.05;
        const lg   = ctx.createGain(); lg.gain.value = v('Width', 0.3) * 0.006 + 0.001;
        lfo.connect(lg); lg.connect(dly1.delayTime); lg.connect(dly2.delayTime);
        const wg  = gain(v('Mix', 0.35)), drg = gain(1);
        inp.connect(dly1); inp.connect(dly2);
        dly1.connect(wg); dly2.connect(wg); wg.connect(out);
        inp.connect(drg); drg.connect(out);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Mix:   x => { wg.gain.value  = x; },
          Speed: x => { lfo.frequency.value = x*0.5+0.05; },
          Width: x => { lg.gain.value  = x*0.006+0.001; },
        }};
      }


      case 'rat': {
        const inp = gain(1), out = gain(v('Volume', 0.7) * 1.5);
        const pre  = gain(v('Distortion', 0.6) * 200 + 10);
        const ws   = shaper(hardClip(v('Distortion', 0.6) * 80 + 20));
        const filt = bq('lowpass', 8000 - v('Filter', 0.3) * 6000, 0.7);
        wire(inp, pre, ws, filt, out);
        return { input:inp, output:out, params:{
          Distortion: x => { pre.gain.value = x*200+10; ws.curve = hardClip(x*80+20); },
          Filter:     x => { filt.frequency.value = 8000 - x*6000; },
          Volume:     x => { out.gain.value = x*1.5; },
        }};
      }

      case 'talkbox': {
        const inp = gain(1), out = gain(v('Mix', 0.8));
        const dry = gain(1 - v('Mix', 0.8));
        const f1 = bq('bandpass', 800,  4);
        const f2 = bq('bandpass', 1200, 3);
        const f3 = bq('bandpass', 2400, 2);
        const fMix = gain(0.4);
        inp.connect(f1); inp.connect(f2); inp.connect(f3);
        f1.connect(fMix); f2.connect(fMix); f3.connect(fMix);
        fMix.connect(out);
        inp.connect(dry); dry.connect(out);
        const lfo = ctx.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = v('Tone', 0.3) * 1.5 + 0.2;
        const lg1 = ctx.createGain(); lg1.gain.value = 300;
        const lg2 = ctx.createGain(); lg2.gain.value = 400;
        lfo.connect(lg1); lg1.connect(f1.frequency); lg1.connect(f2.frequency);
        lfo.connect(lg2); lg2.connect(f3.frequency);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Mix:  x => { out.gain.value = x; dry.gain.value = 1-x; },
          Tone: x => { lfo.frequency.value = x*1.5+0.2; },
        }};
      }

      case 'metal_zone': {
        const inp = gain(1), out = gain(v('Level', 0.6) * 1.5);
        const pre  = gain(v('Distortion', 0.7) * 300 + 10);
        const ws1  = shaper(hardClip(50));
        const ws2  = shaper(distCurve(v('Distortion', 0.7) * 1000 + 200));
        const lo   = bq('lowshelf',  100,  undefined, (v('Low',  0.5) - 0.5) * 24);
        const mid  = bq('peaking',   500,  2.0,       (v('Mid',  0.2) - 0.5) * 26); // very scooped default
        const hi   = bq('highshelf', 5000, undefined, (v('High', 0.6) - 0.5) * 22);
        wire(inp, pre, ws1, ws2, lo, mid, hi, out);
        return { input:inp, output:out, params:{
          Level:      x => { out.gain.value = x*1.5; },
          Distortion: x => { pre.gain.value = x*300+10; ws2.curve = distCurve(x*1000+200); },
          Low:        x => { lo.gain.value  = (x-0.5)*24; },
          Mid:        x => { mid.gain.value = (x-0.5)*26; },
          High:       x => { hi.gain.value  = (x-0.5)*22; },
        }};
      }


      case 'boss_ds1': {
        const inp = gain(1), out = gain(v('Level', 0.6) * 1.4);
        const pre  = gain(v('Dist', 0.5) * 100 + 5);
        const ws   = shaper(hardClip(v('Dist', 0.5) * 60 + 15));
        const tone = bq('highshelf', 2500, undefined, (v('Tone', 0.5) - 0.5) * 20);
        const pres = bq('peaking',   4000, 1.5,        v('Tone', 0.5) * 8);
        wire(inp, pre, ws, tone, pres, out);
        return { input:inp, output:out, params:{
          Level: x => { out.gain.value = x*1.4; },
          Tone:  x => { tone.gain.value = (x-0.5)*20; pres.gain.value = x*8; },
          Dist:  x => { pre.gain.value = x*100+5; ws.curve = hardClip(x*60+15); },
        }};
      }

      case 'super_chorus': {
        const inp = gain(1), out = gain(1);
        const dly1 = ctx.createDelay(0.04); dly1.delayTime.value = 0.015;
        const dly2 = ctx.createDelay(0.04); dly2.delayTime.value = 0.018;
        const lfo  = ctx.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = v('Rate', 0.4) * 4 + 0.2;
        const lg   = ctx.createGain(); lg.gain.value = v('Depth', 0.6) * 0.014 + 0.001;
        const eq   = bq('highshelf', 3000, undefined, (v('EQ', 0.6) - 0.5) * 12);
        lfo.connect(lg); lg.connect(dly1.delayTime); lg.connect(dly2.delayTime);
        const wg = gain(v('Mix', 0.6)), drg = gain(0.9);
        inp.connect(drg); drg.connect(eq); eq.connect(out);
        inp.connect(dly1); inp.connect(dly2);
        dly1.connect(wg); dly2.connect(wg); wg.connect(out);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Rate:  x => { lfo.frequency.value = x*4+0.2; },
          Depth: x => { lg.gain.value = x*0.014+0.001; },
          EQ:    x => { eq.gain.value = (x-0.5)*12; },
          Mix:   x => { wg.gain.value = x; },
        }};
      }

      case 'harmdelay': {
        const inp = gain(1), out = gain(1);
        const dly  = ctx.createDelay(2.0); dly.delayTime.value = v('Time', 0.35) * 1.0;
        const fb   = gain(Math.min(v('Feedback', 0.4) * 0.88, 0.87));
        const wg   = gain(v('Mix', 0.45));
        const drg  = gain(1);
        const mode = v('Mode', 0.5);
        const lfo  = ctx.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = 0.4;
        const lg   = ctx.createGain(); lg.gain.value = mode > 0.5 ? 0.004 : 0;
        lfo.connect(lg); lg.connect(dly.delayTime);
        inp.connect(drg); drg.connect(out);
        inp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wg); wg.connect(out);
        lfo.start(); this._lfoNodes.push(lfo);
        return { input:inp, output:out, params:{
          Time:     x => { dly.delayTime.setTargetAtTime(x*1.0, ctx.currentTime, 0.01); },
          Feedback: x => { fb.gain.value = Math.min(x*0.88, 0.87); },
          Mix:      x => { wg.gain.value = x; },
          Mode:     x => { lg.gain.value = x > 0.5 ? 0.004 : 0; },
        }};
      }


      case 'luna_od': {
        const inp = gain(1), out = gain(v('Volume', 0.7) * 1.6);
        const drive = v('Drive', 0.5);
        const pre   = gain(drive * 50 + 1.5);
        const ws    = shaper(distCurve(drive * 200 + 30));
        const tone  = bq('highshelf', 2000, undefined, (v('Tone', 0.55) - 0.5) * 16);
        const warmth = bq('lowshelf', 150, undefined, 4); // OCD warmth in low mids
        wire(inp, pre, ws, warmth, tone, out);
        return { input:inp, output:out, params:{
          Drive:  x => { pre.gain.value = x*50+1.5; ws.curve = distCurve(x*200+30); },
          Volume: x => { out.gain.value = x*1.6; },
          Tone:   x => { tone.gain.value = (x-0.5)*16; },
        }};
      }

      case 'atm_reverb': {
        const inp = gain(1), out = gain(1);
        const conv = ctx.createConvolver();
        conv.buffer = makeIR(ctx, v('Decay', 0.7) * 6 + 1.0, 1.8);
        const wg  = gain(v('Mix', 0.5)), drg = gain(1);
        const toneF = bq('lowpass', 5000 + (v('Tone', 0.6) - 0.5) * 6000, 0.7);
        const shimDly = ctx.createDelay(0.06); shimDly.delayTime.value = 0.03;
        const shimLfo = ctx.createOscillator(); shimLfo.type = 'sine';
        shimLfo.frequency.value = v('Mod', 0.4) * 3 + 0.2;
        const shimLg = ctx.createGain(); shimLg.gain.value = v('Mod', 0.4) * 0.012;
        shimLfo.connect(shimLg); shimLg.connect(shimDly.delayTime);
        inp.connect(drg); drg.connect(out);
        inp.connect(conv); conv.connect(toneF); toneF.connect(shimDly);
        shimDly.connect(wg); wg.connect(out);
        shimLfo.start(); this._lfoNodes.push(shimLfo);
        return { input:inp, output:out, params:{
          Decay: x => { conv.buffer = makeIR(ctx, x*6+1.0, 1.8); },
          Mix:   x => { wg.gain.value = x; },
          Tone:  x => { toneF.frequency.value = 5000 + (x-0.5)*6000; },
          Mod:   x => { shimLg.gain.value = x*0.012; shimLfo.frequency.value = x*3+0.2; },
        }};
      }

      case 'tape_delay': {
        const inp = gain(1), out = gain(1);
        const dly  = ctx.createDelay(2.0); dly.delayTime.value = v('Time', 0.4) * 0.8;
        const fb   = gain(Math.min(v('Repeats', 0.4) * 0.85, 0.84));
        const wg   = gain(v('Mix', 0.45)), drg = gain(1);
        const warmF = bq('lowpass', 4500, 0.8);
        const wow  = ctx.createOscillator(); wow.type = 'sine';
        wow.frequency.value = v('Wow', 0.3) * 2.5 + 0.3;
        const wowG = ctx.createGain(); wowG.gain.value = v('Wow', 0.3) * 0.008 + 0.001;
        const flutter = ctx.createOscillator(); flutter.type = 'triangle';
        flutter.frequency.value = v('Wow', 0.3) * 7 + 3;
        const flutG = ctx.createGain(); flutG.gain.value = v('Wow', 0.3) * 0.002;
        wow.connect(wowG); wowG.connect(dly.delayTime);
        flutter.connect(flutG); flutG.connect(dly.delayTime);
        inp.connect(drg); drg.connect(out);
        inp.connect(dly); dly.connect(warmF); warmF.connect(fb); fb.connect(dly);
        warmF.connect(wg); wg.connect(out);
        wow.start(); flutter.start(); this._lfoNodes.push(wow, flutter);
        return { input:inp, output:out, params:{
          Time:    x => { dly.delayTime.setTargetAtTime(x*0.8, ctx.currentTime, 0.02); },
          Repeats: x => { fb.gain.value = Math.min(x*0.85, 0.84); },
          Mix:     x => { wg.gain.value = x; },
          Wow:     x => { wowG.gain.value = x*0.008+0.001; flutG.gain.value = x*0.002; wow.frequency.value = x*2.5+0.3; flutter.frequency.value = x*7+3; },
        }};
      }
    }
  },
};
function attachKnob(knobEl, dotEl, initial, onChange) {
  let value = initial;
  let startY, startVal;
  const updateDot = v => { dotEl.style.transform = `translateX(-50%) rotate(${-135 + v * 270}deg)`; };
  updateDot(value);

  const move = e => {
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    value = Math.max(0, Math.min(1, startVal + (startY - cy) / 120));
    updateDot(value);
    onChange(value);
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', up);
  };
  knobEl.addEventListener('mousedown', e => {
    startY = e.clientY; startVal = value;
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
  knobEl.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY; startVal = value;
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
    e.preventDefault();
  }, { passive: false });
}

// ── TUNER PAGE ────────────────────────────────────────────────────────────────
// Tuninguri populare de pe Songsterr / Ultimate Guitar, grupate logic:
// Standard variations (down-tuned half/whole step), Drop tunings, Open tunings,
// Open minor tunings, Modal/alternate, și câteva exotice (All Fourths, NST).

// Generăm frecvențele tuturor notelor de la A0 la C8 matematic — formula
// f = 440 * 2^((midi-69)/12). Acoperă orice tuning posibil + aliasuri flat/sharp.
const NOTE_FREQS = (() => {
  const sharps = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const sharpToFlat = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
  const map = {};
  for (let midi = 21; midi <= 108; midi++) {      // A0 (21) → C8 (108)
    const freq    = 440 * Math.pow(2, (midi - 69) / 12);
    const note    = sharps[midi % 12];
    const octave  = Math.floor(midi / 12) - 1;
    map[note + octave] = freq;
    // alias flat pentru semitonuri (Db ≡ C#, Eb ≡ D#, etc.)
    if (sharpToFlat[note]) map[sharpToFlat[note] + octave] = freq;
  }
  return map;
})();

const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];

let tunerAudio = null;
let tunerAnalyser = null;
let tunerAnimFrame = null;

function freqToNote(freq) {
  // 35 Hz cuprinde și cele mai joase note de pe chitarele 6-corzi în Drop G/G#
  // (G1 ≈ 49 Hz, F#1 ≈ 46 Hz). Sub 35 Hz e sub-bass nedetectabil oricum.
  if (freq < 35) return {note:'--', cents:0, octave:''};
  const noteNum = 12 * Math.log2(freq / 440) + 69;
  const rounded = Math.round(noteNum);
  const cents = Math.round((noteNum - rounded) * 100);
  const name = CHROMATIC[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return {note: name, cents, octave};
}




function loopTuner() {
  if (!tunerAnalyser) return;
  const buf = new Float32Array(tunerAnalyser.fftSize);
  tunerAnalyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, tunerAnalyser.context.sampleRate);
  if (freq > 0) {
    const {note, cents, octave} = freqToNote(freq);
    tunerState.freq = freq;
    tunerState.note = note;
    tunerState.cents = cents;
    tunerState.octave = octave;
    updateTunerDisplay();
  }
  tunerAnimFrame = requestAnimationFrame(loopTuner);
}

function updateTunerDisplay() {
  const noteEl = document.getElementById('t-note');
  const freqEl = document.getElementById('t-freq');
  const centsEl = document.getElementById('t-cents');
  const needle = document.getElementById('t-needle');
  if (!noteEl) return;
  
  const {note, freq, cents} = tunerState;
  noteEl.textContent = note;
  freqEl.textContent = freq > 0 ? freq.toFixed(1) + ' Hz' : '';
  
  const inTune = Math.abs(cents) < 5;
  noteEl.className = 'tuner-note' + (inTune ? ' in-tune' : '');
  
  if (cents > 5) {
    centsEl.textContent = '+' + cents + t('cents_sharp');
    centsEl.className = 'tuner-cents sharp';
  } else if (cents < -5) {
    centsEl.textContent = cents + t('cents_flat');
    centsEl.className = 'tuner-cents flat';
  } else {
    centsEl.textContent = inTune && note!=='--' ? t('in_tune') : '';
    centsEl.className = 'tuner-cents intune';
  }
  
  if (needle) {
    const deg = Math.max(-45, Math.min(45, cents * 0.9));
    needle.style.transform = `translateX(-50%) rotate(${deg}deg)`;
  }
}


function playTone(freq, duration = 1.5) {
  if (!freq) return;
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'triangle';
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.start();
  osc.stop(ctx.currentTime + duration);
  // Închidem contextul după ce se termină nota, altfel se acumulează
  // (browserele limitează la ~6 AudioContext-uri active simultan).
  osc.onended = () => { try { ctx.close(); } catch {} };
}
