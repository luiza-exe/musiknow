function isTypingInInput() {
  const a = document.activeElement;
  if (!a) return false;
  const tag = a.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || a.isContentEditable;
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('mk_theme', next); } catch {}
  render();
}

function toggleLanguage() {
  const next = state.lang === 'ro' ? 'en' : 'ro';
  state.lang = next;
  localStorage.setItem('mk_lang', next);
  render();
}

function setupGlobalShortcuts() {
  document.addEventListener('keydown', (e) => {
    // Daca user-ul scrie in input/textarea, ignoram shortcut-urile globale
    if (isTypingInInput()) return;

    // / pentru search
    if (e.key === '/') {
      e.preventDefault();
      if (state.page === 'search' || state.page === 'library') {
        // Suntem deja pe o pagina cu search input — focuseaza-l
        const inp = document.querySelector('input[type="text"][placeholder*="ut" i], input[type="text"][placeholder*="search" i], #search-global-inp');
        if (inp) { inp.focus(); inp.select?.(); return; }
      }
      navigate('search');
      return;
    }

    // Shift+T = toggle tema
    if (e.shiftKey && e.key === 'T') {
      e.preventDefault();
      toggleTheme();
      return;
    }

    // Shift+L = toggle limba
    if (e.shiftKey && e.key === 'L') {
      e.preventDefault();
      toggleLanguage();
      return;
    }
  });
}

async function boot() {
  // Setup global keyboard shortcuts (functioneaza pe toate paginile)
  setupGlobalShortcuts();

  // Restaurează starea volatilă (selectedSong, songs cache, search, etc.)
  restoreVolatileState();

  // Încarcăm înregistrările persistate (IndexedDB) ÎNAINTE de primul render,
  // ca să apară imediat dacă utilizatorul se duce direct pe pedalboard.
  // Pe paginile non-pedalboard functia nu exista — guard cu typeof.
  if (typeof loadRecordingsFromDB === 'function') {
    try {
      const saved = await loadRecordingsFromDB();
      if (saved.length) state.recordings = saved;
    } catch (e) {
      console.warn('Load recordings failed:', e);
    }
  }

  // Determină pagina cerută de fișierul HTML curent
  const initialPage = window.__INITIAL_PAGE__ || 'login';

  // OAuth callback handling — funcționează doar pe index.html (redirect URI)
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code && state.clientId) {
    window.history.replaceState({}, '', window.location.pathname);
    const ok = await exchangeCode(code);
    if (ok) {
      // După login reușit, mergem la library
      navigate('library');
      return;
    }
  }

  // Dacă fișierul HTML cere pagina login (index.html)
  if (initialPage === 'login') {
    // Dacă utilizatorul e deja logat, redirect direct la library
    if (state.token) {
      navigate('library');
      return;
    }
    state.page = 'login';
    render();
    return;
  }

  // Pagini care necesită login Spotify real (library = melodii personale, profile = profil)
  // Demo mode NU mai are acces la library — utilizatorul e redirectionat la search.
  if (initialPage === 'library' && !state.token) {
    navigate('search');
    return;
  }
  if (initialPage === 'profile' && !state.token) {
    navigate('login');
    return;
  }

  // Pagina song are nevoie de o melodie selectată
  if (initialPage === 'song' && !state.selectedSong) {
    navigate(state.token ? 'library' : 'search');
    return;
  }

  // Dacă suntem pe pagina song, asigurăm că datele AI sunt încărcate.
  // Fetch-ul anterior (de pe library/search) a fost abandonat la navigare.
  if (initialPage === 'song' && state.selectedSong && !state.songInfo[state.selectedSong.id]) {
    fetchSongInfo(state.selectedSong); // re-randează automat la final
  }

  state.page = initialPage;
  render();

  // Dacă suntem pe library și nu avem melodii încărcate, le încărcăm în fundal
  // Dacă suntem pe library și (a) nu avem melodii deloc, sau (b) avem doar o parte
  // incarcata (utilizatorul a iesit din pagina inainte sa termine fetch-ul) → reia.
  if (initialPage === 'library' && state.token) {
    const needsFreshLoad = !state.songsLoaded;
    const needsResume = state.songsLoaded
                     && state._totalLiked > 0
                     && state.songs.length < state._totalLiked;
    if (needsFreshLoad || needsResume) {
      loadSongs().then(() => { if (state.page === 'library') render(); });
    }
  }
}

// Helper: arata o notificare toast scurta in josul ecranului
function showToast(message, isError = false) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = el('div', 'toast');
  if (isError) toast.style.borderColor = 'var(--err)';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity .3s, transform .3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 2200);
}

// Helper: proceseaza o imagine uploadata — o redimensioneaza la max 400x400 si o
// converteste la JPEG (calitate 0.82). Returneaza data URL base64 care poate fi
// stocat direct in IndexedDB. Tipic ~30-60KB per imagine dupa procesare.
function processImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error('Niciun fisier'));
    if (!file.type.startsWith('image/')) return reject(new Error('Trebuie sa fie o imagine'));
    if (file.size > 20 * 1024 * 1024) return reject(new Error('Imagine prea mare (max 20MB)'));

    const MAX_DIM = 400;
    const QUALITY = 0.82;
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Eroare la citirea fisierului'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagine corupta sau format necunoscut'));
      img.onload = () => {
        // Redimensionare proportionala — pastreaza aspect ratio, max 400 pe latura mai mare
        let w = img.width, h = img.height;
        if (w > h && w > MAX_DIM) { h = Math.round(h * (MAX_DIM / w)); w = MAX_DIM; }
        else if (h > MAX_DIM)     { w = Math.round(w * (MAX_DIM / h)); h = MAX_DIM; }

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        // Fundal alb pentru imagini cu transparenta (PNG, WebP) — JPEG nu suporta alpha
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        try {
          const dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Helper: modal generic care returneaza o promisiune cu rezultatul
function openModal(contentBuilder) {
  return new Promise(resolve => {
    const overlay = el('div', 'modal-overlay');
    const box = el('div', 'modal-box');
    overlay.appendChild(box);
    const close = (result) => { overlay.remove(); resolve(result); };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
    document.addEventListener('keydown', function onEsc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(null); }
    });
    contentBuilder(box, close);
    document.body.appendChild(overlay);
    // Auto-focus pe primul input din modal pentru accesibilitate
    setTimeout(() => box.querySelector('input,textarea,button')?.focus(), 50);
  });
}

// Modal: creare playlist nou (sau redenumire daca primeste existingPlaylist)
function openPlaylistFormModal(existingPlaylist = null) {
  return openModal((box, close) => {
    const isEdit = !!existingPlaylist;
    const title = isEdit ? t('rename_playlist') : t('create_playlist');
    const initialCover = existingPlaylist?.coverDataUrl || null;
    const initialColor = existingPlaylist?.color || '#8b5cf6';
    const initialName  = existingPlaylist?.name || '';
    const initial = String(initialName).slice(0,1).toUpperCase() || '♪';

    // Cover state: undefined = nemodificat, null = sters, string = imagine noua
    let coverState = undefined;
    let currentDisplayCover = initialCover;

    box.innerHTML = `
      <div class="modal-title">${title}</div>
      <div class="modal-cover-section">
        <div class="modal-cover-preview" id="cover-preview" style="${currentDisplayCover
          ? `background-image:url('${currentDisplayCover}');background-size:cover;background-position:center;`
          : `background:linear-gradient(135deg,${escapeHtml(initialColor)},${escapeHtml(initialColor)}88);`}">
          ${currentDisplayCover ? '' : `<span>${escapeHtml(initial)}</span>`}
        </div>
        <div class="modal-cover-actions">
          <button type="button" class="modal-btn sec" id="cover-upload-btn">${t('upload_cover')}</button>
          <button type="button" class="modal-btn sec" id="cover-clear-btn" style="${currentDisplayCover ? '' : 'display:none'}">${t('remove_cover')}</button>
        </div>
        <input type="file" id="cover-file-inp" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
        <div class="modal-cover-hint">${t('cover_hint')}</div>
      </div>
      <input type="text" class="inp" id="pl-name-inp" placeholder="${t('playlist_name_placeholder')}" maxlength="100" value="${escapeHtml(initialName)}" style="font-size:16px"/>
      <textarea class="inp" id="pl-desc-inp" placeholder="${t('playlist_desc_placeholder')}" maxlength="500" rows="2" style="resize:vertical;font-family:inherit;font-size:16px">${escapeHtml(existingPlaylist?.description || '')}</textarea>
      <div class="modal-row">
        <button class="modal-btn sec" id="pl-cancel">${t('cancel')}</button>
        <button class="modal-btn primary" id="pl-save" disabled>${isEdit ? t('save') : t('create_playlist')}</button>
      </div>
    `;

    const nameInp = box.querySelector('#pl-name-inp');
    const descInp = box.querySelector('#pl-desc-inp');
    const saveBtn = box.querySelector('#pl-save');
    const preview = box.querySelector('#cover-preview');
    const fileInp = box.querySelector('#cover-file-inp');
    const uploadBtn = box.querySelector('#cover-upload-btn');
    const clearBtn = box.querySelector('#cover-clear-btn');

    const update = () => { saveBtn.disabled = !nameInp.value.trim(); };
    nameInp.addEventListener('input', () => {
      update();
      // Daca nu are cover image, update litera din preview cu prima litera a numelui nou
      if (!currentDisplayCover) {
        const v = nameInp.value.trim() || '♪';
        const span = preview.querySelector('span');
        if (span) span.textContent = String(v).slice(0,1).toUpperCase();
      }
    });
    update();
    nameInp.addEventListener('keydown', e => { if (e.key === 'Enter' && !saveBtn.disabled) saveBtn.click(); });

    // Upload poza
    uploadBtn.addEventListener('click', () => fileInp.click());
    fileInp.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        uploadBtn.disabled = true;
        uploadBtn.textContent = '...';
        const dataUrl = await processImageFile(file);
        currentDisplayCover = dataUrl;
        coverState = dataUrl;
        preview.style.cssText = `background-image:url('${dataUrl}');background-size:cover;background-position:center;`;
        preview.innerHTML = ''; // sterge initiala
        clearBtn.style.display = '';
      } catch (err) {
        showToast(err.message || 'Eroare la procesare', true);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = t('upload_cover');
        fileInp.value = '';
      }
    });

    // Sterge poza (revine la litera + gradient)
    clearBtn.addEventListener('click', () => {
      currentDisplayCover = null;
      coverState = null;
      const v = nameInp.value.trim() || initialName || '♪';
      preview.style.cssText = `background:linear-gradient(135deg,${initialColor},${initialColor}88);`;
      preview.innerHTML = `<span>${escapeHtml(String(v).slice(0,1).toUpperCase())}</span>`;
      clearBtn.style.display = 'none';
    });

    box.querySelector('#pl-cancel').addEventListener('click', () => close(null));
    saveBtn.addEventListener('click', () => close({
      name: nameInp.value.trim(),
      description: descInp.value.trim(),
      coverDataUrl: coverState, // undefined = nemodificat, null = sters, string = nou
    }));
  });
}

// Modal: alege un playlist pentru a adauga o melodie
async function openAddToPlaylistModal(song) {
  const playlists = await playlistsDB.listPlaylists();
  // Pentru fiecare playlist, vad daca melodia e deja inauntru (1 fetch per playlist)
  const inWhich = await Promise.all(playlists.map(async pl => {
    const full = await playlistsDB.getPlaylistWithSongs(pl.id);
    return full.songs.some(s => s.songId === song.id);
  }));

  return openModal((box, close) => {
    const safeSongName = escapeHtml(song.name);
    const safeArtist   = escapeHtml(song.artist);
    let listHtml = '';
    if (playlists.length === 0) {
      listHtml = `<div style="text-align:center;color:var(--dim);font-size:.72rem;padding:18px 8px;">${t('no_playlists_yet')}</div>`;
    } else {
      listHtml = '<div class="modal-list">';
      playlists.forEach((pl, idx) => {
        const safeName = escapeHtml(pl.name);
        const initial = escapeHtml(String(pl.name).slice(0,1).toUpperCase());
        const inPl = inWhich[idx];
        const hasCover = !!pl.coverDataUrl;
        const miniStyle = hasCover
          ? `background-image:url('${pl.coverDataUrl}');background-size:cover;background-position:center;`
          : `background:${escapeHtml(pl.color || '#8b5cf6')};`;
        listHtml += `
          <div class="modal-pl-item" data-id="${pl.id}" ${inPl ? 'data-in="1"' : ''}>
            <div class="modal-pl-mini-cover" style="${miniStyle}">${hasCover ? '' : initial}</div>
            <div class="modal-pl-info">
              <div class="modal-pl-name">${safeName}</div>
              <div class="modal-pl-count">${t('songs_count').replace('{n}', String(pl.songCount || 0))}</div>
            </div>
            ${inPl ? `<div class="modal-pl-status">${t('playlist_song_added')}</div>` : ''}
          </div>
        `;
      });
      listHtml += '</div>';
    }
    box.innerHTML = `
      <div class="modal-title">${t('add_to_playlist')}</div>
      <div style="color:var(--dim);font-size:.7rem;line-height:1.5;">
        <strong style="color:var(--text)">${safeSongName}</strong><br>
        ${safeArtist}
      </div>
      <div style="font-size:.65rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;">${t('select_playlist')}</div>
      ${listHtml}
      <div class="modal-row">
        <button class="modal-btn sec" id="atp-cancel">${t('cancel')}</button>
        <button class="modal-btn primary" id="atp-new">+ ${t('new_playlist')}</button>
      </div>
    `;
    box.querySelectorAll('.modal-pl-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.in === '1') {
          // deja in playlist — inchide cu warning
          close({ duplicate: true, playlistId: parseInt(item.dataset.id) });
          return;
        }
        close({ playlistId: parseInt(item.dataset.id) });
      });
    });
    box.querySelector('#atp-cancel').addEventListener('click', () => close(null));
    box.querySelector('#atp-new').addEventListener('click', () => close({ createNew: true }));
  });
}

// Functia principala — lista playlists sau detalii playlist dupa state.selectedPlaylistId



// Functie reutilizabila: deschide modal-ul de adaugare si proceseaza rezultatul
async function handleAddSongToPlaylist(song) {
  const result = await openAddToPlaylistModal(song);
  if (!result) return;

  if (result.duplicate) {
    const pls = await playlistsDB.listPlaylists();
    const pl = pls.find(p => p.id === result.playlistId);
    if (pl) showToast(t('already_in_playlist').replace('{name}', pl.name), true);
    return;
  }
  if (result.createNew) {
    const created = await openPlaylistFormModal();
    if (!created) return;
    try {
      const newId = await playlistsDB.createPlaylist(created.name, created.description, null, created.coverDataUrl);
      await playlistsDB.addSongToPlaylist(newId, song);
      showToast(t('added_to_playlist').replace('{name}', created.name));
    } catch (err) { showToast(err.message, true); }
    return;
  }
  if (result.playlistId) {
    const pls = await playlistsDB.listPlaylists();
    const pl = pls.find(p => p.id === result.playlistId);
    try {
      await playlistsDB.addSongToPlaylist(result.playlistId, song);
      showToast(t('added_to_playlist').replace('{name}', pl?.name || ''));
    } catch (err) {
      if (err.message === 'DUPLICATE') {
        showToast(t('already_in_playlist').replace('{name}', pl?.name || ''), true);
      } else {
        showToast(err.message, true);
      }
    }
  }
}
